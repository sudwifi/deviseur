<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sud Wifi — Planning V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Montserrat:wght@400;500;600&family=Fira+Sans:wght@600;700&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  /* Thème clair — charte Sud Wifi */
  --bg:#f4f7fb;--s1:#ffffff;--s2:#f0f4f9;--s3:#e4eaf3;--s4:#d8e2ef;
  --border:rgba(0,126,177,.10);--border2:rgba(0,126,177,.20);--border3:rgba(0,126,177,.32);
  --text:#1a2740;--muted:#6a80a0;--muted2:#4a6080;
  --blue:#007eb1;--red:#dc2626;--purple:#7c3aed;--green:#16a34a;
  --gray:#64748b;--yellow:#c8920a;--orange:#d6711a;--teal:#0d9488;--pink:#db2777;
  --font:'Quicksand',sans-serif;--mono:'Fira Mono',monospace;--r:16px;--r-sm:10px;
  --brand-yellow:#fac420;--brand-blue1:#007eb1;--brand-blue2:#12aacc;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button,select,input,textarea{font:inherit}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(59,130,246,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.025) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:-1}
.topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.back-btn{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border);border-radius:999px;padding:6px 14px;color:var(--muted2);font-size:13px;cursor:pointer;text-decoration:none;transition:all .18s;flex-shrink:0}
.back-btn:hover{border-color:var(--border2);color:var(--text)}
.topbar-title{font-size:15px;font-weight:600;letter-spacing:-.3px}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.clock-sm{font-family:var(--mono);font-size:12px;color:var(--muted2)}
.quick-btns{display:flex;gap:6px;flex-wrap:nowrap}
.qb{display:flex;align-items:center;gap:5px;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid;transition:all .15s;white-space:nowrap}
.qb:hover{filter:brightness(1.2)}
.qb-chantier{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.4);color:#007eb1}
.qb-sav{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#dc2626}
.qb-absence{background:rgba(236,72,153,.15);border-color:rgba(236,72,153,.4);color:#be185d}
.qb-achat{background:rgba(139,92,246,.15);border-color:rgba(139,92,246,.4);color:#6d28d9}
.qb-add{background:rgba(0,126,177,.06);border-color:var(--border2);color:var(--muted2)}
.view-tabs{position:sticky;top:58px;z-index:90;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:0}
.view-tab{padding:13px 18px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;transition:all .18s;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none}
.view-tab:hover{color:var(--text)}
.view-tab.active{color:var(--text);border-bottom-color:var(--blue)}
.view-tab-spacer{flex:1}
.sync-pill{font-size:11px;font-family:var(--mono);padding:4px 10px;border-radius:999px;cursor:pointer;background:transparent;border:1px solid rgba(20,184,166,.3);color:var(--teal);transition:all .15s}
.sync-pill:hover{background:rgba(20,184,166,.1)}
.sync-pill.syncing{color:var(--yellow);border-color:rgba(245,158,11,.3);animation:blink .8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.filters-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 20px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.85);position:sticky;top:106px;z-index:80}
.filter-label{font-size:11px;color:var(--muted);font-family:var(--mono);margin-right:2px;flex-shrink:0}
.f-pill{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:11px;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.f-pill:hover{border-color:var(--border2);color:var(--text)}
.f-pill.active{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.45);color:#007eb1}
.f-divider{width:1px;height:18px;background:var(--border);margin:0 2px;flex-shrink:0}
.main{position:relative;z-index:1;padding:18px 20px;max-width:1600px;margin:0 auto}
.week-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.week-nav{display:flex;align-items:center;gap:8px}
.nav-btn{width:30px;height:30px;border-radius:8px;background:var(--s2);border:1px solid var(--border);color:var(--muted2);cursor:pointer;font-size:16px;display:grid;place-items:center;transition:all .15s}
.nav-btn:hover{border-color:var(--border2);color:var(--text)}
.week-label{font-size:14px;font-weight:600;padding:0 6px}
.today-btn{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#007eb1;border-radius:999px;padding:5px 14px;font-size:12px;cursor:pointer;transition:all .15s}
.today-btn:hover{background:rgba(59,130,246,.25)}
.week-grid{display:grid;grid-template-columns:120px repeat(7,minmax(0,1fr));gap:6px;margin-bottom:16px}
.wg-corner{background:var(--s2);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px;display:flex;align-items:flex-end;font-size:10px;color:var(--muted);font-family:var(--mono)}
.wg-day-header{background:var(--s2);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;cursor:pointer;transition:all .18s;text-align:center}
.wg-day-header:hover{border-color:var(--border2)}
.wg-day-header.today{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.35)}
.wg-day-header.selected{background:rgba(59,130,246,.2);border-color:rgba(59,130,246,.6)}
.wg-day-name{font-size:10px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em}
.wg-day-num{font-size:18px;font-weight:600;letter-spacing:-.5px;margin:1px 0}
.wg-day-count{font-size:9px;color:var(--muted)}
.wg-day-header.today .wg-day-num{color:#007eb1}
.wg-team-label{background:var(--s2);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;display:flex;align-items:center;font-size:11px;font-weight:500;line-height:1.3;min-height:68px}
.wg-cell{background:var(--s2);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px;min-height:68px;display:flex;flex-direction:column;gap:3px}
.task-chip{border-radius:6px;padding:4px 6px;font-size:10px;font-weight:500;line-height:1.3;border-left:3px solid;cursor:pointer;transition:transform .12s;position:relative}
.task-chip:hover{transform:translateY(-1px)}
.task-chip.selected{outline:2px solid rgba(0,126,177,.25);outline-offset:1px}
.tc-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-sub{font-size:9px;opacity:.8;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-dates{font-size:9px;opacity:.7;margin-top:1px;font-family:var(--mono)}
.urgency-dot{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%}
.urgency-critical .urgency-dot{background:#dc2626;box-shadow:0 0 4px rgba(239,68,68,.7)}
.urgency-priority .urgency-dot{background:#f97316}
.urgency-normal .urgency-dot{background:rgba(0,126,177,.15)}
.chip-absence{background:rgba(236,72,153,.12);border-color:var(--pink);color:#be185d;border-left:3px solid var(--pink)}
.chip-blue{background:rgba(59,130,246,.16);border-color:#007eb1;color:#007eb1}
.chip-red{background:rgba(239,68,68,.16);border-color:#dc2626;color:#dc2626}
.chip-purple{background:rgba(139,92,246,.16);border-color:#8b5cf6;color:#6d28d9}
.chip-green{background:rgba(34,197,94,.16);border-color:#16a34a;color:#15803d}
.chip-gray{background:rgba(100,116,139,.18);border-color:#64748b;color:#475569}
.chip-yellow{background:rgba(245,158,11,.16);border-color:#f59e0b;color:#b45309}
.chip-orange{background:rgba(251,146,60,.16);border-color:#d6711a;color:#c2410c}
.view-layout{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
.side-panel{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;position:sticky;top:165px}
.sp-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.sp-title{font-size:14px;font-weight:600}
.sp-badge{padding:3px 9px;border-radius:999px;font-size:10px;font-family:var(--mono);border:1px solid var(--border);color:var(--muted2)}
.sp-body{padding:14px}
.day-progress{background:var(--s2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.dp-label{font-size:11px;color:var(--muted);min-width:70px}
.dp-bar-bg{flex:1;height:4px;border-radius:99px;background:var(--s3)}
.dp-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .5s ease}
.dp-count{font-size:11px;font-family:var(--mono);color:var(--muted2);min-width:36px;text-align:right}
.day-sections{display:grid;gap:8px}
.day-section{background:var(--s2);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.day-section-header{padding:7px 11px;font-size:11px;font-weight:600;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:5px}
.day-section-body{padding:6px}
.day-task-row{display:flex;align-items:flex-start;gap:7px;padding:6px 7px;border-radius:6px;font-size:11px;cursor:pointer;transition:background .15s}
.day-task-row:hover{background:rgba(0,126,177,.05)}
.dtr-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:3px}
.dtr-main{flex:1;min-width:0}
.dtr-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtr-sub{font-size:9px;color:var(--muted);margin-top:1px}
.dtr-tag{padding:2px 6px;border-radius:4px;font-size:9px;font-family:var(--mono);flex-shrink:0}
.empty-msg{font-size:11px;color:var(--muted);padding:5px 7px}
.td-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.td-block{background:var(--s2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px}
.td-k{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-family:var(--mono);margin-bottom:2px}
.td-v{font-size:12px;font-weight:500}
.td-desc{background:var(--s2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;font-size:12px;line-height:1.6;color:var(--muted2)}
.td-actions{display:flex;gap:7px;margin-top:9px}
.td-btn{flex:1;padding:7px;border-radius:7px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--s3);color:var(--text);transition:all .15s}
.td-btn:hover{background:var(--s4);border-color:var(--border2)}
.td-btn.primary{background:rgba(59,130,246,.2);border-color:rgba(59,130,246,.4);color:#007eb1}
.td-btn.primary:hover{background:rgba(59,130,246,.3)}
.day-view-header{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.day-view-title{font-size:22px;font-weight:600;letter-spacing:-.5px}
.day-view-sub{font-size:12px;color:var(--muted);margin-top:2px}
.day-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.day-col{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.day-col-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.day-col-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.day-col-count{width:20px;height:20px;border-radius:50%;background:var(--s3);border:1px solid var(--border);font-size:10px;display:grid;place-items:center;font-family:var(--mono)}
.day-col-body{padding:8px;display:grid;gap:5px}
.day-task-card{background:var(--s2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;border-left:3px solid;cursor:pointer;transition:all .15s}
.day-task-card:hover{transform:translateX(2px)}
.dtc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:7px;margin-bottom:3px}
.dtc-title{font-size:12px;font-weight:500}
.dtc-urgency{padding:2px 6px;border-radius:4px;font-size:9px;font-family:var(--mono);flex-shrink:0}
.dtc-meta{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dtc-dates{font-size:10px;color:var(--teal);font-family:var(--mono);margin-top:3px}
.owner-dot{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:700;flex-shrink:0}
.absence-card{background:rgba(236,72,153,.08);border:1px solid rgba(236,72,153,.25);border-radius:var(--r-sm);padding:9px 11px;font-size:12px}
.absence-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.absence-person{display:flex;align-items:center;gap:7px;font-weight:500}
.absence-type{padding:2px 7px;border-radius:4px;font-size:10px;background:rgba(236,72,153,.15);color:#be185d;font-family:var(--mono)}
.absence-dates{font-size:10px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.semester-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.month-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.month-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.month-name{font-size:14px;font-weight:600}
.month-year{font-size:11px;color:var(--muted);font-family:var(--mono)}
.month-body{padding:10px}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.cal-wd{text-align:center;font-size:9px;font-family:var(--mono);color:var(--muted);padding:3px 0;text-transform:uppercase}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{aspect-ratio:1;border-radius:5px;display:grid;place-items:center;font-size:10px;color:var(--muted);position:relative;cursor:default;background:rgba(0,126,177,.03);border:1px solid transparent;transition:all .12s}
.cal-day:hover{background:rgba(0,126,177,.06);border-color:var(--border)}
.cal-day.empty{visibility:hidden}
.cal-day.today{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.4);color:#007eb1;font-weight:600}
.cal-day.absence-day{background:rgba(236,72,153,.12);border-color:rgba(236,72,153,.2)}
.cal-day .cal-dot{position:absolute;bottom:2px;right:2px;width:4px;height:4px;border-radius:50%}
.cal-day.has-critical .cal-dot{background:var(--red)}
.cal-day.has-priority .cal-dot{background:var(--yellow)}
.cal-day.has-normal .cal-dot{background:var(--blue)}
.cal-day.clickable{cursor:pointer}
.cal-day.clickable:hover{background:rgba(0,126,177,.06);border-color:var(--border2);color:var(--text)}
.sem-legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 14px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r-sm)}
.sem-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted2)}
.sem-dot{width:7px;height:7px;border-radius:50%}
.modal-overlay{position:fixed;inset:0;background:rgba(26,39,64,.45);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--s1);border:1px solid var(--border2);border-radius:22px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;transform:translateY(18px);transition:transform .25s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-hdr{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-hdr-title{font-size:16px;font-weight:600}
.modal-close{width:28px;height:28px;border-radius:50%;background:var(--s2);border:1px solid var(--border);color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:all .15s}
.modal-close:hover{background:var(--s3);color:var(--text)}
.modal-body{padding:16px 22px 22px}
.type-selector{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.type-opt{padding:10px 8px;border-radius:10px;border:1px solid var(--border);background:var(--s2);cursor:pointer;text-align:center;transition:all .15s}
.type-opt:hover{border-color:var(--border2)}
.type-opt.selected{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.12)}
.type-opt .to-icon{font-size:16px;margin-bottom:4px}
.type-opt .to-label{font-size:11px;font-weight:500}
.absence-types{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.at-opt{padding:8px 6px;border-radius:9px;border:1px solid var(--border);background:var(--s2);cursor:pointer;text-align:center;transition:all .15s;font-size:11px}
.at-opt:hover{border-color:var(--border2)}
.at-opt.selected{border-color:rgba(236,72,153,.5);background:rgba(236,72,153,.12);color:#be185d}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.form-row.full{grid-template-columns:1fr}
.form-row.trio{grid-template-columns:1fr 1fr 1fr}
.form-group label{display:block;font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.form-input,.form-select,.form-textarea{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:8px 11px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s;-webkit-appearance:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--border3)}
.form-input::placeholder,.form-textarea::placeholder{color:var(--muted)}
.form-select option{background:var(--s2)}
.form-textarea{resize:vertical;min-height:60px}
.form-hint{font-size:10px;color:var(--muted);margin-top:3px}
.form-actions{display:flex;gap:9px;margin-top:14px}
.btn-cancel{flex:1;padding:9px;border-radius:9px;background:var(--s2);border:1px solid var(--border);color:var(--muted2);cursor:pointer;transition:all .15s}
.btn-cancel:hover{border-color:var(--border2);color:var(--text)}
.btn-save{flex:2;padding:9px;border-radius:9px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-save.blue{background:rgba(59,130,246,.2);border:1px solid rgba(59,130,246,.4);color:#007eb1}
.btn-save.blue:hover{background:rgba(59,130,246,.3)}
.btn-save.pink{background:rgba(236,72,153,.2);border:1px solid rgba(236,72,153,.4);color:#be185d}
.sync-bar{position:fixed;bottom:18px;right:20px;z-index:150;display:flex;align-items:center;gap:7px;background:var(--s2);border:1px solid var(--border2);border-radius:999px;padding:7px 14px;font-size:12px;opacity:0;transform:translateY(6px);transition:all .3s;pointer-events:none}
.sync-bar.show{opacity:1;transform:translateY(0)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.sync-dot.loading{background:var(--yellow);animation:blink .8s ease-in-out infinite}
.sync-dot.error{background:var(--red)}
@media(max-width:1100px){.view-layout{grid-template-columns:1fr}.side-panel{position:static}.day-columns{grid-template-columns:1fr 1fr}.semester-grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.main{padding:12px 14px}.topbar{padding:0 14px}.quick-btns{display:none}.week-grid{grid-template-columns:80px repeat(5,minmax(0,1fr))}.day-columns{grid-template-columns:1fr}.semester-grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.form-row.trio{grid-template-columns:1fr 1fr}.type-selector{grid-template-columns:repeat(4,1fr)}.absence-types{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.view-tabs{overflow-x:auto;scrollbar-width:none}.view-tabs::-webkit-scrollbar{display:none}.filters-strip{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}.filters-strip::-webkit-scrollbar{display:none}}
.main>*{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
/* ── MODULE HEURES ── */
.h-section{display:none}.h-section.active{display:block}
.h-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.h-tab{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.h-tab:hover{border-color:var(--border2);color:var(--text)}
.h-tab.active{background:rgba(20,184,166,.15);border-color:rgba(20,184,166,.4);color:var(--teal)}
.h-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.h-card-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.h-card-title{font-size:13px;font-weight:600}
.h-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.h-metric{background:var(--s2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;text-align:center}
.h-metric .val{font-size:22px;font-weight:600;letter-spacing:-.5px}
.h-metric .lbl{font-size:11px;color:var(--muted);margin-top:3px}
.h-metric .sub{font-size:10px;margin-top:2px;font-family:var(--mono)}
.h-table{width:100%;border-collapse:collapse;font-size:12px}
.h-table th{text-align:left;padding:7px 10px;font-weight:500;font-size:10px;color:var(--muted);border-bottom:1px solid var(--border);font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.h-table td{padding:6px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.h-table tr:last-child td{border-bottom:none}
.h-table tr:hover td{background:rgba(0,126,177,.03)}
.h-input{width:54px;padding:4px 6px;background:var(--s3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;text-align:center;font-family:var(--mono);outline:none;transition:border-color .15s}
.h-input:focus{border-color:var(--teal)}
.h-badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:500;font-family:var(--mono)}
.h-badge-ok{background:rgba(34,197,94,.12);color:#15803d;border:1px solid rgba(34,197,94,.25)}
.h-badge-warn{background:rgba(245,158,11,.12);color:#b45309;border:1px solid rgba(245,158,11,.25)}
.h-badge-danger{background:rgba(239,68,68,.12);color:#dc2626;border:1px solid rgba(239,68,68,.25)}
.h-badge-info{background:rgba(20,184,166,.12);color:var(--teal);border:1px solid rgba(20,184,166,.25)}
.h-badge-gray{background:rgba(100,116,139,.15);color:#475569;border:1px solid rgba(100,116,139,.3)}
.h-person-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.h-week-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.h-week-lbl{font-size:13px;font-weight:600;padding:0 6px}
.h-prog{height:5px;border-radius:3px;background:var(--s3);overflow:hidden;margin-top:5px}
.h-prog-fill{height:100%;border-radius:3px;transition:width .4s}
.h-note{background:rgba(20,184,166,.06);border:1px solid rgba(20,184,166,.18);border-radius:var(--r-sm);padding:10px 14px;font-size:11px;color:var(--muted2);line-height:1.6;margin-top:12px}
.h-note strong{color:var(--teal)}
.h-sel{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--text);font-size:12px;outline:none}
.h-solde-pos{color:#15803d;font-weight:600;font-family:var(--mono)}
.h-solde-zero{color:var(--muted);font-family:var(--mono)}
/* Charte Sud Wifi — typographies */
.topbar-title,.modal-title,h1,h2,h3{font-family:'Fira Sans',sans-serif}
.view-tab,.filter-label,.qb,.btn-save,.btn-ghost,.sync-pill,.h-tab{font-family:'Montserrat',sans-serif}
/* Multi-sélection collaborateurs */
.member-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.member-pill{font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--border2);background:var(--s2);color:var(--muted2);cursor:pointer;transition:all .15s}
.member-pill:hover{border-color:var(--blue);color:var(--blue)}
.member-pill.selected{background:rgba(0,126,177,.12);border-color:var(--blue);color:var(--blue);font-weight:600}
/* Co-assignés dans les chips */
.tc-team{font-size:8px;margin-top:2px;opacity:.85;letter-spacing:.3px}
.tc-extra{display:inline-block;background:rgba(0,126,177,.14);color:var(--blue);border-radius:999px;padding:0 5px;font-size:8px;font-weight:700;margin-left:4px;vertical-align:middle}
/* Tâches terminées — affichage barré */
.done-check{color:var(--green);font-weight:700;margin-right:2px}
.task-chip.done{opacity:.55}
.task-chip.done .tc-title{text-decoration:line-through}
.day-task-card.done{opacity:.6}
.day-task-card.done .dtc-title{text-decoration:line-through}
.day-task-row.done .dtr-title{text-decoration:line-through;opacity:.8}
.month-dot.done{opacity:.45}
</style>
</head>
<body>

<header class="topbar">
  <a class="back-btn" href="https://sudwifi.github.io/deviseur/sudwifi-dashboard.html">← Dashboard</a>
  <div class="topbar-title">📅 Planning V2</div>
  <div class="topbar-right">
    <div class="quick-btns">
      <button class="qb qb-chantier" onclick="quickAdd('chantier')">🔧 Chantier</button>
      <button class="qb qb-sav" onclick="quickAdd('sav')">🚨 SAV</button>
      <button class="qb qb-absence" onclick="openAbsenceModal()">🏖 Absence</button>
      <button class="qb qb-achat" onclick="quickAdd('achats')">📦 Achat</button>
      <button class="qb qb-add" onclick="openAddModal()">+ Autre</button>
    </div>
    <div class="clock-sm" id="clock"></div>
  </div>
</header>

<div class="view-tabs">
  <button class="view-tab active" onclick="setView('semaine',this)">Semaine</button>
  <button class="view-tab" onclick="setView('jour',this)">Jour</button>
  <button class="view-tab" onclick="setView('semestre',this)">Semestre</button>
  <button class="view-tab" onclick="setView('heures',this)" style="color:var(--teal)">⏱ Heures &amp; RCR</button>
  <div class="view-tab-spacer"></div>
  <button class="sync-pill" id="syncBtn" onclick="syncFromSheets()">⟳ Sync</button>
</div>

<div class="filters-strip">
  <span class="filter-label">vue</span>
  <button class="f-pill active" data-role="direction" onclick="setRole(this)">Direction</button>
  <button class="f-pill" data-role="operations" onclick="setRole(this)">Opérations</button>
  <button class="f-pill" data-role="adv" onclick="setRole(this)">ADV</button>
  <button class="f-pill" data-role="coordination" onclick="setRole(this)">Gestion & coordination (Amanda)</button>
  <div class="f-divider"></div>
  <span class="filter-label">type</span>
  <button class="f-pill" data-type="chantier" onclick="toggleType(this)">Chantier</button>
  <button class="f-pill" data-type="sav" onclick="toggleType(this)">SAV</button>
  <button class="f-pill" data-type="achats" onclick="toggleType(this)">Achats</button>
  <button class="f-pill" data-type="business" onclick="toggleType(this)">Business</button>
  <button class="f-pill" data-type="admin" onclick="toggleType(this)">Admin</button>
  <button class="f-pill" data-type="marketing" onclick="toggleType(this)">Com</button>
  <button class="f-pill" data-type="absence" onclick="toggleType(this)" style="color:#be185d;border-color:rgba(236,72,153,.3)">Absences</button>
</div>

<main class="main" id="mainContent"></main>

<!-- MODAL TÂCHE -->
<div class="modal-overlay" id="modalTask" onclick="closeModalOutside(event,'modalTask')">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-hdr-title" id="modalTaskTitle">Nouvelle tâche</div>
      <button class="modal-close" onclick="closeModal('modalTask')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId"/>
      <div class="type-selector" id="typeSelector">
        <div class="type-opt" data-type="chantier" onclick="selectType('chantier')"><div class="to-icon">🔧</div><div class="to-label">Chantier</div></div>
        <div class="type-opt" data-type="sav" onclick="selectType('sav')"><div class="to-icon">🚨</div><div class="to-label">SAV</div></div>
        <div class="type-opt" data-type="achats" onclick="selectType('achats')"><div class="to-icon">📦</div><div class="to-label">Achats</div></div>
        <div class="type-opt" data-type="business" onclick="selectType('business')"><div class="to-icon">💼</div><div class="to-label">Business</div></div>
        <div class="type-opt" data-type="admin" onclick="selectType('admin')"><div class="to-icon">🗂️</div><div class="to-label">Admin</div></div>
        <div class="type-opt" data-type="marketing" onclick="selectType('marketing')"><div class="to-icon">📣</div><div class="to-label">Com</div></div>
        <div class="type-opt" data-type="reunion" onclick="selectType('reunion')"><div class="to-icon">🗓️</div><div class="to-label">Réunion</div></div>
        <div class="type-opt" data-type="absence" onclick="selectType('absence')"><div class="to-icon">🏖</div><div class="to-label">Absence</div></div>
      </div>
      <input type="hidden" id="fType" value="chantier"/>
      <div class="form-row">
        <div class="form-group"><label>Titre *</label><input class="form-input" id="fTitle" placeholder="Ex: SAV Miremer"/></div>
        <div class="form-group"><label>Site / client</label><input class="form-input" id="fSite" placeholder="Ex: Camping Miremer"/></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Date début *</label><input class="form-input" id="fDateStart" type="date"/></div>
        <div class="form-group"><label>Date fin</label><input class="form-input" id="fDateEnd" type="date"/><div class="form-hint">Laisser vide = 1 jour</div></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Responsable</label>
          <select class="form-select" id="fOwner">
            <option>Virginie</option><option>Stéphane</option>
            <option>Anthony</option><option>Fabian</option>
            <option>Jonovan</option><option>Fred</option>
            <option>Ambre</option><option>Amanda</option>
          </select>
        </div>
        <div class="form-group">
          <label>Urgence</label>
          <select class="form-select" id="fUrgency">
            <option value="normal">Normal</option>
            <option value="priority">Prioritaire</option>
            <option value="critical">Critique</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Statut</label>
          <select class="form-select" id="fStatus">
            <option>À faire</option><option>Planifié</option>
            <option>En cours</option><option>Bloqué</option><option>Terminé</option>
          </select>
        </div>
        <div class="form-group"></div>
      </div>
      <div class="form-row full">
        <div class="form-group">
          <label>Affecter à — sélection multiple</label>
          <div class="member-pills" id="fMembers">
            <button type="button" class="member-pill" data-member="anthony"  onclick="toggleMemberPill(this)">Anthony</button>
            <button type="button" class="member-pill" data-member="fabian"   onclick="toggleMemberPill(this)">Fabian</button>
            <button type="button" class="member-pill" data-member="jonovan"  onclick="toggleMemberPill(this)">Jonovan</button>
            <button type="button" class="member-pill" data-member="fred"     onclick="toggleMemberPill(this)">Fred</button>
            <button type="button" class="member-pill" data-member="ambre"    onclick="toggleMemberPill(this)">Ambre</button>
            <button type="button" class="member-pill" data-member="virginie" onclick="toggleMemberPill(this)">Virginie</button>
            <button type="button" class="member-pill" data-member="stephane" onclick="toggleMemberPill(this)">Stéphane</button>
            <button type="button" class="member-pill" data-member="amanda"   onclick="toggleMemberPill(this)">Amanda</button>
          </div>
          <input type="hidden" id="fTeam"/>
        </div>
      </div>
      <div class="form-row full"><div class="form-group"><label>Description</label><textarea class="form-textarea" id="fDesc" placeholder="Détails, consignes, contexte…"></textarea></div></div>
      <div class="form-row full"><div class="form-group"><label>Lien utile</label><input class="form-input" id="fLink" placeholder="Axonaut, Omada, Crisp…"/></div></div>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeModal('modalTask')">Annuler</button>
        <button class="btn-save blue" onclick="saveTask()">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL ABSENCE -->
<div class="modal-overlay" id="modalAbsence" onclick="closeModalOutside(event,'modalAbsence')">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-hdr-title">🏖 Déclarer une absence</div>
      <button class="modal-close" onclick="closeModal('modalAbsence')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="absEditId"/>
      <div class="absence-types" id="absenceTypes">
        <div class="at-opt selected" data-atype="conge" onclick="selectAbsType('conge')">🏖 Congés</div>
        <div class="at-opt" data-atype="maladie" onclick="selectAbsType('maladie')">🤒 Maladie</div>
        <div class="at-opt" data-atype="formation" onclick="selectAbsType('formation')">📚 Formation</div>
        <div class="at-opt" data-atype="autre" onclick="selectAbsType('autre')">📌 Autre</div>
      </div>
      <input type="hidden" id="absType" value="conge"/>
      <div class="form-row full">
        <div class="form-group">
          <label>Personne concernée *</label>
          <select class="form-select" id="absPerson">
            <option>Virginie</option><option>Stéphane</option>
            <option>Anthony</option><option>Fabian</option>
            <option>Jonovan</option><option>Fred</option>
            <option>Ambre</option><option>Amanda</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Du *</label><input class="form-input" id="absStart" type="date"/></div>
        <div class="form-group"><label>Au *</label><input class="form-input" id="absEnd" type="date"/></div>
      </div>
      <div class="form-row full"><div class="form-group"><label>Note</label><input class="form-input" id="absNote" placeholder="Ex: congés été, formation Omada…"/></div></div>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeModal('modalAbsence')">Annuler</button>
        <button class="btn-save pink" onclick="saveAbsence()">Enregistrer l'absence</button>
      </div>
    </div>
  </div>
</div>

<div class="sync-bar" id="syncBar"><div class="sync-dot" id="syncDot"></div><span id="syncMsg">Synchronisé</span></div>

<script>
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbye5ghdeGfjeAaQGLkRgTDzGVGaXkvntKXL1VDcxwRQ5oxaGgHzJGNefm68KDT_ZXZh/exec';
const USE_DEMO_DATA=false;

const typeConfig={
  chantier:{color:'blue',  label:'Chantier',dot:'#007eb1'},
  sav:     {color:'red',   label:'SAV',     dot:'#dc2626'},
  achats:  {color:'purple',label:'Achats',  dot:'#8b5cf6'},
  business:{color:'green', label:'Business',dot:'#16a34a'},
  admin:   {color:'gray',  label:'Admin',   dot:'#64748b'},
  marketing:{color:'yellow',label:'Com',    dot:'#f59e0b'},
  reunion: {color:'orange',label:'Réunion', dot:'#d6711a'},
  absence: {color:'absence',label:'Absence',dot:'#ec4899'},
};
const absTypeLabel={conge:'Congés',maladie:'Maladie',formation:'Formation',autre:'Absence'};
const urgencyTag={
  critical:{label:'CRITIQUE',   bg:'rgba(239,68,68,.18)',  color:'#dc2626'},
  priority:{label:'PRIORITAIRE',bg:'rgba(245,158,11,.18)', color:'#b45309'},
  normal:  {label:'NORMAL',     bg:'rgba(100,116,139,.18)',color:'#475569'},
};

// ── UNE LIGNE PAR PERSONNE ──
const teamLabels={
  anthony: 'Anthony',
  fabian:  'Fabian',
  jonovan: 'Jonovan',
  fred:'Fred',
  ambre:   'Ambre',
  stephane:'Stéphane',
  virginie:'Virginie',
  amanda:  'Amanda',
};

const poleMembers={
  direction:   ['anthony','fabian','jonovan','fred','ambre','stephane','virginie','amanda'],
  operations:  ['anthony','fabian','jonovan','fred','stephane'],
  adv:         ['ambre'],
  coordination:['amanda'],
};

const ownerColors={
  Anthony:'#007eb1', Fabian:'#12aacc', Jonovan:'#7c3aed', 'Fred':'#d6711a',
  Ambre:'#8b5cf6',   Amanda:'#0891b2', Virginie:'#16a34a', 'Stéphane':'#dc2626',
};

let tasks    =loadLocal('sw_tasks_v2')||(USE_DEMO_DATA?getDemoTasks():[]);
let absences =loadLocal('sw_absences')||(USE_DEMO_DATA?getDemoAbsences():[]);
let selectedRole='direction',activeTypes=new Set(),currentView='semaine';
let selectedTaskId=null,selectedDay=null,weekOffset=0;

function today(){const d=new Date();return fmt(d)}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return fmt(d)}
function getWeekStart(off=0){const d=new Date();const day=d.getDay();d.setDate(d.getDate()+(day===0?-6:1-day)+off*7);return fmt(d)}
function parseDate(s){return new Date(s+'T12:00:00')}
function fmtDisplay(s){const d=parseDate(s);const dn=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];const mn=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];return dn[d.getDay()]+' '+d.getDate()+' '+mn[d.getMonth()]}
function fmtLong(s){const d=parseDate(s);const dn=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];const mn=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];return dn[d.getDay()]+' '+d.getDate()+' '+mn[d.getMonth()]+' '+d.getFullYear()}
function uid(){return 't_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function taskOnDay(t,ds){const s=t.date_start||t.date||'';const e=t.date_end||s;return s&&ds>=s&&ds<=e}
function absenceOnDay(a,ds){return ds>=a.start&&ds<=a.end}
function taskDuration(t){const s=t.date_start||t.date||'';const e=t.date_end||s;if(!s)return 1;return Math.max(1,Math.round((parseDate(e)-parseDate(s))/(1000*3600*24))+1)}
function loadLocal(k){try{const d=localStorage.getItem(k);return d?JSON.parse(d):null}catch(e){return null}}
function saveLocal(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function saveAll(){saveLocal('sw_tasks_v2',tasks);saveLocal('sw_absences',absences)}

function visibleTasks(){
  return tasks.filter(t=>{
    const _mem=membersOf(t);
    let roleOk=selectedRole==='direction'?true:_mem.some(m=>(poleMembers[selectedRole]||[]).includes(m));
    const typeOk=activeTypes.size===0||activeTypes.has(t.type);
    return roleOk&&typeOk;
  });
}

function updateClock(){
  const now=new Date(),h=String(now.getHours()).padStart(2,'0'),m=String(now.getMinutes()).padStart(2,'0');
  const dn=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'],mn=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
  const el=document.getElementById('clock');
  if(el)el.textContent=dn[now.getDay()]+' '+now.getDate()+' '+mn[now.getMonth()]+' · '+h+':'+m;
}
updateClock();setInterval(updateClock,10000);

function setView(v,btn){currentView=v;document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));if(btn)btn.classList.add('active');render()}
function setRole(btn){document.querySelectorAll('[data-role]').forEach(p=>p.classList.remove('active'));btn.classList.add('active');selectedRole=btn.dataset.role;render()}
function toggleType(btn){const t=btn.dataset.type;if(activeTypes.has(t)){activeTypes.delete(t);btn.classList.remove('active');}else{activeTypes.add(t);btn.classList.add('active');}render()}
function render(){if(currentView==='semaine')renderSemaine();else if(currentView==='jour')renderJour();else if(currentView==='heures')renderHeures();else renderSemestre()}

function renderSemaine(){
  const ws=getWeekStart(weekOffset);
  const days=Array.from({length:7},(_,i)=>addDays(ws,i));
  const todayStr=today();
  if(!selectedDay)selectedDay=todayStr;
  const vt=visibleTasks();
  const visibleIds=poleMembers[selectedRole]||Object.keys(teamLabels);
  const teams=Object.entries(teamLabels).filter(([id])=>visibleIds.includes(id));
  const d0=parseDate(days[0]),d6=parseDate(days[6]);
  const mn=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
  const weekLabel=d0.getDate()+' '+mn[d0.getMonth()]+' → '+d6.getDate()+' '+mn[d6.getMonth()]+' '+d6.getFullYear();

  let html=`<div class="week-header">
    <div class="week-nav">
      <button class="nav-btn" onclick="weekOffset--;render()">‹</button>
      <span class="week-label">${weekLabel}</span>
      <button class="nav-btn" onclick="weekOffset++;render()">›</button>
    </div>
    <button class="today-btn" onclick="weekOffset=0;selectedDay='${todayStr}';render()">Aujourd'hui</button>
  </div>
  <div class="view-layout"><div><div class="week-grid">
    <div class="wg-corner">personne / jour</div>`;

  days.forEach(d=>{
    const dd=parseDate(d);
    const dn=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
    const count=vt.filter(t=>taskOnDay(t,d)).length;
    const absCount=absences.filter(a=>absenceOnDay(a,d)).length;
    const isTd=d===todayStr,isSel=d===selectedDay;
    html+=`<div class="wg-day-header ${isTd?'today':''} ${isSel?'selected':''}" onclick="selectedDay='${d}';render()">

  // ── UNE LIGNE PAR PERSONNE ──
  teams.forEach(([personId,personName])=>{
    html+=`<div class="wg-team-label">${personName}</div>`;
    days.forEach(d=>{
      const dayTasks=vt.filter(t=>taskOnDay(t,d)&&membersOf(t).includes(personId));
      const dayAbs=absences.filter(a=>absenceOnDay(a,d)&&a.person===personName);
      html+=`<div class="wg-cell">`;
      dayAbs.forEach(a=>{
        html+=`<div class="task-chip chip-absence"><div class="tc-title">🏖 ${esc(a.person)}</div><div class="tc-sub">${absTypeLabel[a.type]||'Absence'}</div></div>`;
      });
      dayTasks.forEach(t=>{
        const cfg=typeConfig[t.type]||typeConfig.admin;
        const sel=t.id===selectedTaskId?'selected':'';
        const isDone=t.status==='Terminé';
        const dur=taskDuration(t),start=t.date_start||t.date||'';
        const isFirst=start===d,isLast=(t.date_end||start)===d;
        const spanCls=dur>1?(isFirst?'span-start':isLast?'span-end':'span-mid'):'';
        const others=membersOf(t).filter(m=>m!==personId);
        html+=`<div class="task-chip chip-${cfg.color} urgency-${t.urgency} ${sel} ${spanCls} ${isDone?'done':''}" onclick="selectTask('${t.id}')">
          <div class="tc-title">${isDone?'<span class="done-check">✓</span>':''}${esc(t.title)}${others.length?`<span class="tc-extra" title="${esc(others.map(m=>teamLabels[m]||m).join(', '))}">+${others.length}</span>`:''}</div>
          ${isFirst&&t.site?`<div class="tc-sub">${esc(t.site)}</div>`:''}
          ${isFirst&&others.length?`<div class="tc-team">👥 ${esc(memberInitials(membersOf(t)))}</div>`:''}
          ${dur>1&&isFirst?`<div class="tc-dates">${fmtDisplay(start)} → ${fmtDisplay(t.date_end||start)}</div>`:''}
          <div class="urgency-dot"></div>
        </div>`;
      });
      html+=`</div>`;
    });
  });
  html+=`</div></div>`;

  // Side panel
  const selTask=tasks.find(t=>t.id===selectedTaskId);
  const dayTasks=vt.filter(t=>taskOnDay(t,selectedDay));
  const dayAbs=absences.filter(a=>absenceOnDay(a,selectedDay));
  const done=dayTasks.filter(t=>t.status==='Terminé').length;
  const pct=dayTasks.length?Math.round(done/dayTasks.length*100):0;

  html+=`<div><div class="side-panel">
    <div class="sp-header">
      <div class="sp-title">📌 ${selectedDay?fmtDisplay(selectedDay):'—'}</div>
      <div class="sp-badge">${dayTasks.length} tâche${dayTasks.length!==1?'s':''}</div>
    </div>
    <div class="sp-body">
      <div class="day-progress">
        <div class="dp-label">Avancement</div>
        <div class="dp-bar-bg"><div class="dp-bar-fill" style="width:${pct}%"></div></div>
        <div class="dp-count">${done}/${dayTasks.length}</div>
      </div>`;

  if(dayAbs.length){
    html+=`<div class="day-section" style="margin-bottom:8px">
      <div class="day-section-header" style="color:#be185d">🏖 Absences (${dayAbs.length})</div>
      <div class="day-section-body">`;
    dayAbs.forEach(a=>{
      html+=`<div class="day-task-row"><div class="dtr-dot" style="background:#ec4899"></div>
        <div class="dtr-main"><div class="dtr-title">${esc(a.person)}</div>
        <div class="dtr-sub">${absTypeLabel[a.type]||'Absence'} · jusqu'au ${fmtDisplay(a.end)}</div></div></div>`;
    });
    html+=`</div></div>`;
  }

  html+=`<div class="day-sections">`;
  [{label:'🔧 Terrain',types:['chantier','sav']},{label:'🚨 Urgences',filter:t=>t.urgency!=='normal'},
   {label:'📦 Achats',types:['achats']},{label:'💼 Business / Com',types:['business','marketing']},
   {label:'🗂️ Admin / Réunion',types:['admin','reunion']}].forEach(sec=>{
    let items=sec.filter?dayTasks.filter(sec.filter):dayTasks.filter(t=>sec.types.includes(t.type));
    if(!items.length)return;
    const u=urgencyTag;
    html+=`<div class="day-section"><div class="day-section-header">${sec.label}<span style="margin-left:auto;font-size:9px;color:var(--muted);font-family:var(--mono)">${items.length}</span></div><div class="day-section-body">`;
    items.forEach(t=>{
      const cfg=typeConfig[t.type]||typeConfig.admin,uu=urgencyTag[t.urgency]||urgencyTag.normal,dur=taskDuration(t);
      const _done=t.status==='Terminé';
      html+=`<div class="day-task-row ${_done?'done':''}" onclick="selectTask('${t.id}')">
        <div class="dtr-dot" style="background:${cfg.dot}"></div>
        <div class="dtr-main"><div class="dtr-title">${_done?'<span class="done-check">✓</span>':''}${esc(t.title)}${dur>1?` <span style="font-size:9px;color:var(--teal)">(${dur}j)</span>`:''}</div>
        <div class="dtr-sub">${esc(t.owner)} · ${esc(t.site||'')}</div></div>
        <div class="dtr-tag" style="background:${uu.bg};color:${uu.color}">${t.status}</div>
      </div>`;
    });
    html+=`</div></div>`;
  });
  html+=`</div>`;

  if(selTask){
    const cfg=typeConfig[selTask.type]||typeConfig.admin,dur=taskDuration(selTask);
    html+=`<div style="margin-top:10px">
      <div class="td-grid">
        <div class="td-block"><div class="td-k">Titre</div><div class="td-v">${esc(selTask.title)}</div></div>
        <div class="td-block"><div class="td-k">Type</div><div class="td-v" style="color:${cfg.dot}">${cfg.label}</div></div>
        <div class="td-block"><div class="td-k">Responsable</div><div class="td-v">${esc(selTask.owner)}</div></div>
        <div class="td-block"><div class="td-k">Équipe</div><div class="td-v">${esc(membersOf(selTask).map(m=>teamLabels[m]||m).join(', ')||'—')}</div></div>
        <div class="td-block"><div class="td-k">Site</div><div class="td-v">${esc(selTask.site||'—')}</div></div>
        <div class="td-block"><div class="td-k">Statut</div><div class="td-v">${esc(selTask.status)}</div></div>
        <div class="td-block"><div class="td-k">Durée</div><div class="td-v" style="color:var(--teal)">${dur} jour${dur>1?'s':''}</div></div>
      </div>
      ${selTask.description?`<div class="td-desc">${esc(selTask.description)}</div>`:''}
      <div class="td-actions">
        <button class="td-btn primary" onclick="openEditModal('${selTask.id}')">✏️</button>
        <button class="td-btn" onclick="markDone('${selTask.id}')" title="${selTask.status==='Terminé'?'Rouvrir la tâche':'Marquer terminée'}">${selTask.status==='Terminé'?'↺':'✓'}</button>
        <button class="td-btn" style="color:#dc2626" onclick="deleteTask('${selTask.id}')">✕</button>
      </div>
    </div>`;
  }
  html+=`</div></div></div></div>`;
  document.getElementById('mainContent').innerHTML=html;
}

function renderJour(){
  if(!selectedDay)selectedDay=today();
  const vt=visibleTasks().filter(t=>taskOnDay(t,selectedDay));
  const dayAbs=absences.filter(a=>absenceOnDay(a,selectedDay));
  const todayStr=today();
  const done=vt.filter(t=>t.status==='Terminé').length,crits=vt.filter(t=>t.urgency==='critical');
  let html=`<div class="day-view-header">
    <div class="week-nav">
      <button class="nav-btn" onclick="selectedDay=addDays(selectedDay,-1);render()">‹</button>
      <button class="nav-btn" onclick="selectedDay=addDays(selectedDay,1);render()">›</button>
    </div>
    <div><div class="day-view-title">${fmtLong(selectedDay)}</div>
    <div class="day-view-sub">${vt.length} tâche${vt.length!==1?'s':''} · ${done} terminée${done!==1?'s':''} · ${crits.length} critique${crits.length!==1?'s':''}${dayAbs.length?` · ${dayAbs.length} absence${dayAbs.length>1?'s':''} 🏖`:''}</div></div>
    <button class="today-btn" onclick="selectedDay='${todayStr}';render()" style="margin-left:auto">Aujourd'hui</button>
  </div>`;
  if(dayAbs.length){
    html+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-bottom:14px">`;
    dayAbs.forEach(a=>{const oc=ownerColors[a.person]||'#8fa3c8';html+=`<div class="absence-card"><div class="absence-card-top"><div class="absence-person"><div class="owner-dot" style="background:${oc}22;color:${oc}">${a.person[0]}</div>${esc(a.person)}</div><span class="absence-type">${absTypeLabel[a.type]||'Absence'}</span></div><div class="absence-dates">Du ${fmtDisplay(a.start)} au ${fmtDisplay(a.end)}</div></div>`;});
    html+=`</div>`;
  }
  if(crits.length){html+=`<div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:var(--r);padding:12px 14px;margin-bottom:14px"><div style="font-size:12px;font-weight:600;color:#dc2626;margin-bottom:8px">🚨 Urgences critiques (${crits.length})</div><div style="display:grid;gap:5px">`;crits.forEach(t=>{html+=dayTaskCardHtml(t);});html+=`</div></div>`;}
  html+=`<div class="day-columns">`;
  [{label:'🔧 Terrain',types:['chantier','sav'],color:'var(--blue)'},{label:'💼 Business / Achats',types:['business','achats','admin'],color:'var(--green)'},{label:'📣 Com / Réunion',types:['marketing','reunion'],color:'var(--yellow)'}].forEach(col=>{
    const items=vt.filter(t=>col.types.includes(t.type));
    html+=`<div class="day-col"><div class="day-col-header"><div class="day-col-title" style="color:${col.color}">${col.label}</div><div class="day-col-count">${items.length}</div></div><div class="day-col-body">`;
    if(!items.length)html+=`<div class="empty-msg">Rien de prévu.</div>`;
    items.forEach(t=>{html+=dayTaskCardHtml(t);});
    html+=`</div></div>`;
  });
  html+=`</div>`;
  document.getElementById('mainContent').innerHTML=html;
}

function dayTaskCardHtml(t){
  const cfg=typeConfig[t.type]||typeConfig.admin,u=urgencyTag[t.urgency]||urgencyTag.normal,oc=ownerColors[t.owner]||'#8fa3c8',dur=taskDuration(t);
  const isDone=t.status==='Terminé';
  const team=membersOf(t).map(m=>teamLabels[m]||m);
  return `<div class="day-task-card chip-${cfg.color} ${isDone?'done':''}" onclick="selectTask('${t.id}');setView('semaine',null)" style="border-left-color:${cfg.dot}">
    <div class="dtc-top"><div class="dtc-title">${isDone?'<span class="done-check">✓</span>':''}${esc(t.title)}</div><div class="dtc-urgency" style="background:${u.bg};color:${u.color}">${u.label}</div></div>
    ${dur>1?`<div class="dtc-dates">📅 ${fmtDisplay(t.date_start||t.date||'')} → ${fmtDisplay(t.date_end||t.date_start||t.date||'')} (${dur}j)</div>`:''}
    <div class="dtc-meta"><div style="display:flex;align-items:center;gap:4px"><div class="owner-dot" style="background:${oc}22;color:${oc}">${(t.owner||'?')[0]}</div>${esc(t.owner)}</div>${t.site?'· '+esc(t.site):''} · <span style="color:var(--muted)">${t.status}</span></div>
    ${team.length>1?`<div class="dtc-meta" style="margin-top:3px">👥 ${esc(team.join(', '))}</div>`:''}
  </div>`;
}

function renderSemestre(){
  const vt=visibleTasks(),now=new Date();
  const monthsToShow=Array.from({length:6},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()+i,1);return{year:d.getFullYear(),month:d.getMonth()};});
  const mN=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  let html=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><div style="font-size:18px;font-weight:600;letter-spacing:-.3px">Vue semestre ${now.getFullYear()}</div><div style="font-size:11px;color:var(--muted)">Cliquer sur un jour pour le détail</div></div><div class="semester-grid">`;
  monthsToShow.forEach(({year,month})=>{
    const firstDay=new Date(year,month,1),lastDay=new Date(year,month+1,0);
    const startDow=(firstDay.getDay()+6)%7,total=lastDay.getDate();
    html+=`<div class="month-card"><div class="month-header"><div class="month-name">${mN[month]}</div><div class="month-year">${year}</div></div><div class="month-body"><div class="cal-weekdays">`;
    ['L','M','M','J','V','S','D'].forEach(d=>{html+=`<div class="cal-wd">${d}</div>`;});
    html+=`</div><div class="cal-days">`;
    for(let i=0;i<startDow;i++)html+=`<div class="cal-day empty"></div>`;
    for(let d=1;d<=total;d++){
      const ds=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const dt=vt.filter(t=>taskOnDay(t,ds)),hasAbs=absences.some(a=>absenceOnDay(a,ds));
      const hasCrit=dt.some(t=>t.urgency==='critical'),hasPrio=dt.some(t=>t.urgency==='priority'),hasNorm=dt.length>0;
      const isTd=ds===today(),dotCls=hasCrit?'has-critical':hasPrio?'has-priority':hasNorm?'has-normal':'',clickable=dt.length||hasAbs?'clickable':'';
      html+=`<div class="cal-day ${isTd?'today':''} ${dotCls} ${hasAbs?'absence-day':''} ${clickable}" ${(dt.length||hasAbs)?`onclick="selectedDay='${ds}';setView('jour',document.querySelectorAll('.view-tab')[1])"`:''}>
        ${d}${dt.length||hasAbs?`<div class="cal-dot"></div>`:''}
      </div>`;
    }
    html+=`</div></div></div>`;
  });
  html+=`</div><div class="sem-legend">
    <div class="sem-legend-item"><div class="sem-dot" style="background:var(--red)"></div>Urgence critique</div>
    <div class="sem-legend-item"><div class="sem-dot" style="background:var(--yellow)"></div>Prioritaire</div>
    <div class="sem-legend-item"><div class="sem-dot" style="background:var(--blue)"></div>Activité normale</div>
    <div class="sem-legend-item"><div class="sem-dot" style="background:var(--pink)"></div>Absence</div>
  </div>`;
  document.getElementById('mainContent').innerHTML=html;
}

const NAME_TO_ID={Virginie:'virginie',Stéphane:'stephane',Anthony:'anthony',Fabian:'fabian',Jonovan:'jonovan',Fred:'fred',Ambre:'ambre',Amanda:'amanda'};
function membersOf(t){return (Array.isArray(t.members)&&t.members.length)?t.members:(t.team?[t.team]:[]);}
function toggleMemberPill(btn){btn.classList.toggle('selected');}
function getSelectedMembers(){return Array.from(document.querySelectorAll('#fMembers .member-pill.selected')).map(b=>b.dataset.member);}
function setSelectedMembers(arr){const set=new Set((arr||[]).map(String));document.querySelectorAll('#fMembers .member-pill').forEach(b=>b.classList.toggle('selected',set.has(b.dataset.member)));}
function memberInitials(ids){return ids.map(id=>(teamLabels[id]||id||'?').charAt(0).toUpperCase()).join(' ');}

function selectTask(id){selectedTaskId=id;const t=tasks.find(x=>x.id===id);if(t)selectedDay=t.date_start||t.date||today();render()}
function markDone(id){const t=tasks.find(x=>x.id===id);if(t){t.status=(t.status==='Terminé')?'À faire':'Terminé';saveAll();render();showSync(t.status==='Terminé'?'Tâche terminée ✓':'Tâche réouverte');if(typeof APPS_SCRIPT_URL!=='undefined'&&APPS_SCRIPT_URL)pushToSheets(t);}}
function deleteTask(id){if(!confirm('Supprimer cette tâche ?'))return;tasks=tasks.filter(x=>x.id!==id);if(selectedTaskId===id)selectedTaskId=null;saveAll();render();showSync('Tâche supprimée')}

function quickAdd(type){
  openAddModal();selectType(type);
  if(type==='sav'){document.getElementById('fUrgency').value='critical';setSelectedMembers(['fabian']);document.getElementById('fOwner').value='Fabian';}
  else if(type==='chantier'){setSelectedMembers(['anthony']);document.getElementById('fOwner').value='Anthony';}
  else if(type==='achats'){setSelectedMembers(['ambre']);document.getElementById('fOwner').value='Ambre';}
}

function openAddModal(){
  document.getElementById('editId').value='';document.getElementById('modalTaskTitle').textContent='Nouvelle tâche';
  document.getElementById('fTitle').value='';document.getElementById('fSite').value='';
  document.getElementById('fDateStart').value=selectedDay||today();document.getElementById('fDateEnd').value='';
  document.getElementById('fOwner').value='Virginie';document.getElementById('fUrgency').value='normal';
  document.getElementById('fStatus').value='À faire';document.getElementById('fTeam').value='';
  setSelectedMembers([]);
  document.getElementById('fDesc').value='';document.getElementById('fLink').value='';
  selectType('chantier');document.getElementById('modalTask').classList.add('open');
}

function openEditModal(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  document.getElementById('editId').value=t.id;document.getElementById('modalTaskTitle').textContent='Modifier la tâche';
  document.getElementById('fTitle').value=t.title||'';document.getElementById('fSite').value=t.site||'';
  document.getElementById('fDateStart').value=t.date_start||t.date||'';document.getElementById('fDateEnd').value=t.date_end||'';
  document.getElementById('fOwner').value=t.owner||'Virginie';document.getElementById('fUrgency').value=t.urgency||'normal';
  document.getElementById('fStatus').value=t.status||'À faire';
  const _m=(Array.isArray(t.members)&&t.members.length)?t.members:(t.team?[t.team]:[]);
  document.getElementById('fTeam').value=_m[0]||'';setSelectedMembers(_m);
  document.getElementById('fDesc').value=t.description||'';document.getElementById('fLink').value=t.link||'';
  selectType(t.type||'chantier');document.getElementById('modalTask').classList.add('open');
}

function selectType(type){document.getElementById('fType').value=type;document.querySelectorAll('.type-opt').forEach(o=>{o.classList.toggle('selected',o.dataset.type===type);})}

function saveTask(){
  const title=document.getElementById('fTitle').value.trim(),dateStart=document.getElementById('fDateStart').value;
  if(!title){alert('Le titre est obligatoire.');return;}if(!dateStart){alert('La date de début est obligatoire.');return;}
  const dateEnd=document.getElementById('fDateEnd').value,editId=document.getElementById('editId').value;
  const owner=document.getElementById('fOwner').value;
  let members=getSelectedMembers();
  if(!members.length){const oid=NAME_TO_ID[owner];members=oid?[oid]:['anthony'];}
  const team=members[0];
  const obj={id:editId||uid(),title,site:document.getElementById('fSite').value.trim(),type:document.getElementById('fType').value,urgency:document.getElementById('fUrgency').value,date_start:dateStart,date_end:dateEnd||dateStart,date:dateStart,owner,status:document.getElementById('fStatus').value,team,members,description:document.getElementById('fDesc').value.trim(),link:document.getElementById('fLink').value.trim(),subtitle:document.getElementById('fSite').value.trim(),roles:[...new Set([...members,'direction'])]};
  if(editId){const i=tasks.findIndex(x=>x.id===editId);if(i>=0)tasks[i]=obj;else tasks.push(obj);}else tasks.push(obj);
  selectedTaskId=obj.id;selectedDay=dateStart;saveAll();closeModal('modalTask');render();showSync('Tâche enregistrée');
  if(APPS_SCRIPT_URL)pushToSheets(obj);
}

function openAbsenceModal(){document.getElementById('absEditId').value='';document.getElementById('absStart').value=selectedDay||today();document.getElementById('absEnd').value=selectedDay||today();document.getElementById('absNote').value='';selectAbsType('conge');document.getElementById('modalAbsence').classList.add('open')}
function selectAbsType(type){document.getElementById('absType').value=type;document.querySelectorAll('.at-opt').forEach(o=>{o.classList.toggle('selected',o.dataset.atype===type);})}
function saveAbsence(){
  const person=document.getElementById('absPerson').value,start=document.getElementById('absStart').value,end=document.getElementById('absEnd').value;
  if(!start||!end){alert('Les dates sont obligatoires.');return;}if(end<start){alert('La date de fin doit être après la date de début.');return;}
  absences.push({id:uid(),person,type:document.getElementById('absType').value,start,end,note:document.getElementById('absNote').value.trim()});
  saveAll();closeModal('modalAbsence');render();showSync(`Absence de ${person} enregistrée`);
}

function closeModal(id){document.getElementById(id).classList.remove('open')}
function closeModalOutside(e,id){if(e.target===document.getElementById(id))closeModal(id)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){['modalTask','modalAbsence'].forEach(closeModal);}});

function syncFromSheets(){
  if(!APPS_SCRIPT_URL){showSync('⚠ URL non configurée','error');return;}
  showSync('Synchronisation…','loading');const btn=document.getElementById('syncBtn');if(btn){btn.classList.add('syncing');btn.textContent='⟳ Sync…';}
  const old=document.getElementById('jsonp_script');if(old)old.remove();if(window._jsonpCallback)delete window._jsonpCallback;
  const timer=setTimeout(()=>{showSync('Délai dépassé','error');const s=document.getElementById('jsonp_script');if(s)s.remove();if(btn){btn.classList.remove('syncing');btn.textContent='⟳ Sync';}},10000);
  window._jsonpCallback=function(data){clearTimeout(timer);if(btn){btn.classList.remove('syncing');btn.textContent='⟳ Sync';}if(data&&data.tasks){tasks=data.tasks.map(t=>({...t,date_start:String(t.date_start||t.date||'').substring(0,10),date_end:String(t.date_end||t.date_start||t.date||'').substring(0,10),date:String(t.date_start||t.date||'').substring(0,10),roles:Array.isArray(t.roles)?t.roles:String(t.roles||'direction').split(',').map(r=>r.trim())}));saveAll();render();showSync(`${tasks.length} tâches synchronisées ✓`);}else{showSync('Réponse inattendue','error');}};

}

const H_TEAM=[
  {id:'virginie', name:'Virginie', contrat:35, role:'Gérante',   color:'#16a34a'},
  {id:'stephane', name:'Stéphane', contrat:35, role:'Gérant',    color:'#dc2626'},

  {id:'fred',     name:'Fred',     contrat:35, role:'35h',        color:'#d6711a'},
  {id:'jonovan',  name:'Jonovan',  contrat:35, role:'35h',        color:'#7c3aed'},
];

let hWeekOffset=0;
let hData=loadLocal('sw_heures_v1')||{};

function hSaveAll(){saveLocal('sw_heures_v1',hData);}

function hWeekKey(off){
  const days=hGetWeekDates(off);
  const d=days[0];
  const yr=d.getFullYear();
  const wn=hIsoWeek(d);
  return yr+'W'+String(wn).padStart(2,'0');
}

function hGetWeekDates(off){
  const now=new Date();
  const day=now.getDay();
  const diff=(day===0?-6:1-day);
  const mon=new Date(now);
  mon.setDate(now.getDate()+diff+(off*7));
  const days=[];
  for(let i=0;i<6;i++){
    const d=new Date(mon);
    d.setDate(mon.getDate()+i);
    days.push(d);
  }
  return days;
}

function hIsoWeek(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const dayNum=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-dayNum);
  const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-yearStart)/86400000)+1)/7);
}

function hFmtDate(d){
  return d.getDate().toString().padStart(2,'0')+'/'+(d.getMonth()+1).toString().padStart(2,'0');
}

function hGetVal(wk,pid,jour){
  return (hData[wk]&&hData[wk][pid]&&hData[wk][pid][jour]!==undefined)?hData[wk][pid][jour]:'';
}

function hSetVal(wk,pid,jour,val){
  if(!hData[wk])hData[wk]={};
  if(!hData[wk][pid])hData[wk][pid]={};
  hData[wk][pid][jour]=val;
  hSaveAll();
}

function hTotalSem(wk,pid){
  let t=0;
  for(let j=0;j<6;j++){
    const v=parseFloat(hGetVal(wk,pid,j));
    if(!isNaN(v))t+=v;
  }
  return +t.toFixed(2);
}

function hCalcRCR(hs,contrat){
  if(hs<=0)return 0;
  if(contrat===42)return +hs.toFixed(2);
  const seuil=Math.max(35,contrat);
  const t1=Math.min(hs,43-seuil);
  const t2=Math.max(0,hs-(43-seuil));
  return +(t1*1.25+t2*1.5).toFixed(2);
}

function hCheckMaxDay(wk,pid){
  for(let j=0;j<6;j++){
    const v=parseFloat(hGetVal(wk,pid,j));
    if(!isNaN(v)&&v>10)return true;
  }
  return false;
}

function hWeekFromNum(year,week){
  const d=new Date(year,0,1);
  const day=d.getDay()||7;
  if(day!==4)d.setHours(0,0,0,0);
  d.setDate(d.getDate()+(4-day)-(7*(day>4?1:0)));
  d.setDate(d.getDate()-3+7*week);
  return d;
}

function hUpdateCell(wk,pid,jour,val){
  const v=val===''?'':parseFloat(val);
  hSetVal(wk,pid,jour,isNaN(v)?'':v);
  renderHeures();
}

function hChangeWeek(d){hWeekOffset+=d;renderHeures();}
function hShowSection(s){
  document.querySelectorAll('.h-section').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.h-tab').forEach(x=>x.classList.remove('active'));
  const sec=document.getElementById('hs-'+s);
  if(sec)sec.classList.add('active');
  const tabs=document.querySelectorAll('[data-hsec="'+s+'"]');
  tabs.forEach(t=>t.classList.add('active'));
}

function renderHeures(){
  const wk=hWeekKey(hWeekOffset);
  const days=hGetWeekDates(hWeekOffset);
  const mn=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
  const dn=['Lun','Mar','Mer','Jeu','Ven','Sam'];
  const weekLabel='Semaine du '+hFmtDate(days[0])+' au '+hFmtDate(days[5])+' (S'+hIsoWeek(days[0])+')';

  // ── Calcul des soldes globaux ──
  let totalRCR={};
  H_TEAM.forEach(p=>{
    let t=0;
    Object.keys(hData).forEach(w=>{
      const tot=hTotalSem(w,p.id);
      const hs=Math.max(0,tot-p.contrat);
      t+=hCalcRCR(hs,p.contrat);
    });
    totalRCR[p.id]=+t.toFixed(2);
  });

  let html=`<div class="h-tabs">
    <button class="h-tab active" data-hsec="saisie" onclick="hShowSection('saisie')">Saisie semaine</button>

    <button class="h-tab" data-hsec="soldes" onclick="hShowSection('soldes')">Soldes RCR</button>
  </div>`;

  // ── SECTION SAISIE ──
  html+=`<div id="hs-saisie" class="h-section active">`;
  html+=`<div class="h-week-nav">
    <button class="nav-btn" onclick="hChangeWeek(-1)">‹</button>
    <span class="h-week-lbl">${weekLabel}</span>
    <button class="nav-btn" onclick="hChangeWeek(1)">›</button>
    <button class="today-btn" onclick="hWeekOffset=0;renderHeures()" style="margin-left:8px">Cette semaine</button>
  </div>`;
  html+=`<div class="h-card"><div style="overflow-x:auto"><table class="h-table">
    <thead><tr>
      <th style="min-width:90px">Salarié</th>
      <th>Contrat</th>`;
  days.forEach((d,i)=>{
    html+=`<th style="text-align:center">${dn[i]}<br><span style="font-family:var(--mono);font-size:9px;opacity:.7">${hFmtDate(d)}</span></th>`;
  });
  html+=`<th>Total</th><th>HS brutes</th><th>RCR dû</th><th>Statut</th></tr></thead><tbody>`;

  H_TEAM.forEach(p=>{
    const tot=hTotalSem(wk,p.id);
    const hs=Math.max(0,+(tot-p.contrat).toFixed(2));
    const rcr=hCalcRCR(hs,p.contrat);
    const alertDay=hCheckMaxDay(wk,p.id);
    const alertWeek=tot>48;
    let badge='';
    if(alertDay||alertWeek){
      const msg=(alertDay?'⚠ >10h/j ':'')+( alertWeek?'⚠ >48h':'');
      badge=`<span class="h-badge h-badge-danger">${msg.trim()}</span>`;
    }else if(hs>0){
      badge=`<span class="h-badge h-badge-warn">+${hs}h HS</span>`;
    }else if(tot>0){
      badge=`<span class="h-badge h-badge-ok">OK</span>`;
    }else{
      badge=`<span class="h-badge h-badge-gray">—</span>`;
    }
    html+=`<tr>
      <td><span class="h-person-dot" style="background:${p.color}"></span><strong>${p.name}</strong></td>
      <td style="font-family:var(--mono);font-size:11px;color:var(--muted)">${p.contrat}h</td>`;
    for(let j=0;j<6;j++){
      const v=hGetVal(wk,p.id,j);
      html+=`<td style="text-align:center"><input class="h-input" type="number" min="0" max="14" step="0.5" value="${v}" onchange="hUpdateCell('${wk}','${p.id}',${j},this.value)"></td>`;
    }
    html+=`<td style="font-family:var(--mono);font-weight:600">${tot>0?tot+'h':'—'}</td>`;
    html+=`<td style="font-family:var(--mono);color:#b45309">${hs>0?'+'+hs+'h':'—'}</td>`;
    html+=`<td style="font-family:var(--mono);color:#15803d">${rcr>0?'+'+rcr+'h':'—'}</td>`;
    html+=`<td>${badge}</td></tr>`;
  });
  html+=`</tbody></table></div></div>`;
  html+=`<div class="h-note"><strong>Repos compensateur de remplacement (RCR) :</strong> les heures supplémentaires ne sont pas majorées en salaire mais récupérées en repos, avec majoration.<br>
    <strong>Majorations légales :</strong> +25&nbsp;% de la 36e à la 43e heure (1&nbsp;h supp = 1&nbsp;h&nbsp;15 de repos) · +50&nbsp;% au-delà de la 43e heure (1&nbsp;h = 1&nbsp;h&nbsp;30 de repos).<br>
    <strong>Maxima légaux :</strong> 10&nbsp;h/jour · 48&nbsp;h/semaine (44&nbsp;h en moyenne sur 12 semaines) · le RCR doit être pris dans les 2&nbsp;mois suivant son acquisition (art. D3121-18 C. trav.).
  </div></div>`;

  // ── SECTION MENSUEL ──
  const now2=new Date();
  html+=`<div id="hs-mensuel" class="h-section">`;
  const moisNoms=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  let mSelOpts='',ySelOpts='';
  moisNoms.forEach((m,i)=>{mSelOpts+=`<option value="${i}"${i===now2.getMonth()?' selected':''}>${m}</option>`;});

    <select class="h-sel" id="hSelYear" onchange="hRenderMensuel()">${ySelOpts}</select>
  </div>`;
  html+=`<div class="h-card"><div style="overflow-x:auto"><table class="h-table" id="hMensuelTable">

    <tbody id="hMensuelBody"><tr><td colspan="7" style="color:var(--muted);font-style:italic;padding:16px">Cliquez sur le mois voulu pour calculer…</td></tr></tbody>
  </table></div></div></div>`;

  // ── SECTION SOLDES ──
  html+=`<div id="hs-soldes" class="h-section">`;
  html+=`<div class="h-metrics">`;
  H_TEAM.forEach(p=>{
    const rcr=totalRCR[p.id]||0;
    const cls=rcr>0?'#15803d':rcr<0?'#dc2626':mn[0];
    const txtColor=rcr>0?'#15803d':rcr===0?'var(--muted)':'#dc2626';
    const pct=Math.min(100,rcr/20*100);
    html+=`<div class="h-metric">
      <div class="val" style="color:${txtColor}">${rcr>0?'+':''}${rcr}h</div>
      <div class="lbl">${p.name}</div>
      <div class="sub" style="color:var(--muted)">${p.contrat}h</div>
      <div class="h-prog"><div class="h-prog-fill" style="width:${pct}%;background:${rcr>0?'var(--teal)':'var(--gray)'}"></div></div>
    </div>`;
  });
  html+=`</div>`;

  // Historique des semaines
  const allWeeks=Object.keys(hData).sort();
  html+=`<div class="h-card"><div class="h-card-hdr"><span class="h-card-title">Historique semaine par semaine</span></div><div style="overflow-x:auto"><table class="h-table"><thead><tr><th>Semaine</th>`;
  H_TEAM.forEach(p=>{html+=`<th><span class="h-person-dot" style="background:${p.color}"></span>${p.name}</th>`;});
  html+=`</tr></thead><tbody>`;
  if(allWeeks.length===0){
    html+=`<tr><td colspan="${H_TEAM.length+1}" style="color:var(--muted);font-style:italic;padding:16px">Aucune saisie pour le moment — commencez par l'onglet "Saisie semaine".</td></tr>`;
  }else{
    allWeeks.forEach(w=>{
      html+=`<tr><td style="font-family:var(--mono);font-size:11px">S${w.split('W')[1]} ${w.split('W')[0]}</td>`;
      H_TEAM.forEach(p=>{
        const tot=hTotalSem(w,p.id);
        const hs=Math.max(0,tot-p.contrat);
        const rcr=hCalcRCR(hs,p.contrat);
        html+=`<td>${rcr>0?`<span class="h-solde-pos">+${rcr}h</span>`:tot>0?`<span class="h-solde-zero">—</span>`:''}</td>`;
      });
      html+=`</tr>`;
    });
  }
  html+=`</tbody></table></div></div>`;
  html+=`<div class="h-note"><strong>Rappel légal :</strong> Le solde RCR accumulé doit être pris dans un délai maximum de <strong>2 mois</strong> après acquisition (article D3121-18 du Code du travail). Planifiez les récupérations dans l'onglet Planning.</div>`;
  html+=`</div>`;

  document.getElementById('mainContent').innerHTML=html;
}

function hRenderMensuel(){
  const selM=parseInt(document.getElementById('hSelMonth').value);
  const selY=parseInt(document.getElementById('hSelYear').value);
  const body=document.getElementById('hMensuelBody');
  if(!body)return;
  body.innerHTML='';
  const allWeeks=Object.keys(hData);

  H_TEAM.forEach(p=>{
    let totH=0,totHS=0,alertMax=false;
    allWeeks.forEach(wk=>{
      const yr=parseInt(wk.split('W')[0]);
      const wkn=parseInt(wk.split('W')[1]);
      const d=hWeekFromNum(yr,wkn);
      if(d.getMonth()===selM&&d.getFullYear()===selY){
        const t=hTotalSem(wk,p.id);
        totH+=t;
        totHS+=Math.max(0,t-p.contrat);
        if(hCheckMaxDay(wk,p.id)||t>48)alertMax=true;
      }
    });
    const hContrat=Math.round(p.contrat*4.33);
    const rcr=hCalcRCR(totHS,p.contrat);
    // solde cumulé tous mois confondus
    let soldeTotal=0;
    allWeeks.forEach(wk=>{const t=hTotalSem(wk,p.id);const hs=Math.max(0,t-p.contrat);soldeTotal+=hCalcRCR(hs,p.contrat);});
    soldeTotal=+soldeTotal.toFixed(2);
    const alertBadge=alertMax?`<span class="h-badge h-badge-danger">Dépassement</span>`:totH>0?`<span class="h-badge h-badge-ok">RAS</span>`:'—';
    body.innerHTML+=`<tr>
      <td><span class="h-person-dot" style="background:${p.color}"></span><strong>${p.name}</strong></td>
      <td style="font-family:var(--mono)">${hContrat}h est.</td>
      <td style="font-family:var(--mono)">${totH>0?+totH.toFixed(1)+'h':'—'}</td>
      <td style="font-family:var(--mono);color:#b45309">${totHS>0?'+'+totHS.toFixed(1)+'h':'—'}</td>
      <td style="font-family:var(--mono);color:#15803d">${rcr>0?'+'+rcr.toFixed(2)+'h RCR':'—'}</td>
      <td style="font-family:var(--mono);color:${soldeTotal>0?'#15803d':'var(--muted)'}">${soldeTotal>0?'+':''}<strong>${soldeTotal}h</strong></td>
      <td>${alertBadge}</td>
    </tr>`;
  });
}
