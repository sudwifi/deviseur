<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sud Wifi — Achats & Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&family=Montserrat:wght@400;500;600&family=Fira+Sans:wght@600;700&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --yellow:  #fac420;
  --blue1:   #007eb1;
  --blue2:   #12aacc;
  --orange:  #d6711a;
  --bg:      #f4f7fb;
  --s1:      #ffffff;
  --s2:      #f0f4f9;
  --s3:      #e4eaf3;
  --s4:      #d8e2ef;
  --border:  rgba(0,126,177,.10);
  --border2: rgba(0,126,177,.22);
  --border3: rgba(0,126,177,.38);
  --text:    #1a2740;
  --muted:   #6a80a0;
  --muted2:  #4a6080;
  --green:   #16a34a;
  --red:     #dc2626;
  --purple:  #7c3aed;
  --gray:    #64748b;
  --teal:    #0891b2;
  --font:    'Quicksand', sans-serif;
  --title:   'Fira Sans', sans-serif;
  --sub:     'Montserrat', sans-serif;
  --mono:    'Fira Mono', monospace;
  --r:       16px;
  --r-sm:    10px;
  --shadow-sm: 0 1px 4px rgba(0,126,177,.07), 0 2px 12px rgba(0,126,177,.06);
  --shadow-md: 0 4px 20px rgba(0,126,177,.10), 0 1px 4px rgba(0,126,177,.06);
}
@keyframes spin { from { display:inline-block; transform:rotate(0deg); } to { transform:rotate(360deg); } }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button,select,input,textarea{font:inherit;color:var(--text)}

/* FIX CRITIQUE : z-index:-1 pour ne pas bloquer les clics */
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle,rgba(0,126,177,.07) 1px,transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
  z-index:-1;  /* ← CORRECTION : était 0, bloquait tous les clics */
}

/* ─── TOPBAR ─── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.92);backdrop-filter:blur(18px);
  border-bottom:1.5px solid var(--border2);
  padding:0 24px;height:60px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  box-shadow:var(--shadow-sm);
}
.topbar::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--blue1),var(--blue2),var(--yellow));
}
.back-btn{
  display:flex;align-items:center;gap:8px;
  background:var(--s2);border:1.5px solid var(--border);
  border-radius:999px;padding:6px 14px;
  color:var(--muted2);font-family:var(--sub);font-size:13px;font-weight:500;
  cursor:pointer;text-decoration:none;transition:all .18s;
}
.back-btn:hover{border-color:var(--blue2);color:var(--blue1)}
.topbar-title{
  font-family:var(--title);font-size:17px;font-weight:700;
  letter-spacing:-.3px;color:var(--blue1);
}
.topbar-right{display:flex;align-items:center;gap:10px}
.add-btn{
  display:flex;align-items:center;gap:6px;
  background:rgba(250,196,32,.15);border:1.5px solid rgba(250,196,32,.4);
  color:#92660a;border-radius:999px;padding:7px 16px;
  font-family:var(--sub);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .18s;
}
.add-btn:hover{background:rgba(250,196,32,.28);border-color:rgba(250,196,32,.6)}
.add-btn.blue{
  background:rgba(0,126,177,.10);border-color:rgba(0,126,177,.3);color:var(--blue1);
}
.add-btn.blue:hover{background:rgba(0,126,177,.18)}

/* ─── TABS ─── */
.tabs{
  position:sticky;top:60px;z-index:90;
  background:rgba(255,255,255,.90);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:0 24px;display:flex;align-items:center;gap:0;
}
.tab{
  padding:14px 20px;
  font-family:var(--sub);font-size:13px;font-weight:600;
  color:var(--muted);border-bottom:2px solid transparent;
  cursor:pointer;transition:all .18s;white-space:nowrap;
  background:none;border-top:none;border-left:none;border-right:none;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--blue1);border-bottom-color:var(--blue1)}

/* ─── MAIN ─── */
.main{position:relative;z-index:1;padding:24px;max-width:1400px;margin:0 auto;display:grid;gap:20px}

/* ─── KPI ROW ─── */
.kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{
  background:var(--s1);border:1.5px solid var(--border);
  border-radius:var(--r-sm);padding:16px 18px;
  display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow-sm);
}
.kpi-icon{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.kpi .label{font-family:var(--sub);font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi .value{font-family:var(--title);font-size:24px;font-weight:700;letter-spacing:-.5px;margin:3px 0;color:var(--text)}
.kpi .sub{font-size:11px;color:var(--muted2)}

/* ─── PANEL ─── */
.panel{background:var(--s1);border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.panel-header{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.panel-title{font-family:var(--title);font-size:15px;font-weight:700;color:var(--text)}
.panel-sub{font-family:var(--sub);font-size:12px;color:var(--muted);margin-top:2px;font-weight:500}
.panel-actions{display:flex;gap:8px;align-items:center}

/* ─── BADGES / TAGS ─── */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:999px;font-family:var(--mono);font-size:11px;
  border:1px solid var(--border);color:var(--muted2);background:var(--s2);
}
.tag{padding:3px 8px;border-radius:6px;font-family:var(--mono);font-size:10px;font-weight:500}
.tag-ok    {background:rgba(22,163,74,.12); color:#15803d; border:1px solid rgba(22,163,74,.2)}
.tag-warn  {background:rgba(214,113,26,.12);color:#b45309; border:1px solid rgba(214,113,26,.2)}
.tag-crit  {background:rgba(220,38,38,.12); color:#dc2626; border:1px solid rgba(220,38,38,.2)}
.tag-info  {background:rgba(0,126,177,.10);  color:var(--blue1); border:1px solid rgba(0,126,177,.2)}
.tag-purple{background:rgba(124,58,237,.10);color:#6d28d9; border:1px solid rgba(124,58,237,.2)}
.tag-gray  {background:rgba(100,116,139,.10);color:var(--gray); border:1px solid rgba(100,116,139,.2)}

/* ─── STOCK TABLE ─── */
.stock-filters{
  padding:12px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--s2);
}
.sf-pill{
  background:transparent;border:1.5px solid var(--border);
  color:var(--muted);border-radius:999px;
  padding:5px 13px;font-family:var(--sub);font-size:12px;font-weight:500;
  cursor:pointer;transition:all .15s;
}
.sf-pill:hover{border-color:var(--blue2);color:var(--blue1)}
.sf-pill.active{background:rgba(0,126,177,.12);border-color:var(--blue1);color:var(--blue1)}
.search-input{
  background:var(--s1);border:1.5px solid var(--border);
  border-radius:999px;padding:6px 14px;color:var(--text);
  font-family:var(--font);font-size:12px;outline:none;width:200px;
  transition:border-color .15s;
}
.search-input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(18,170,204,.10)}
.search-input::placeholder{color:var(--muted)}

.stock-table{width:100%;border-collapse:collapse}
.stock-table th{
  padding:10px 16px;text-align:left;
  font-family:var(--sub);font-size:10px;font-weight:700;
  color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  border-bottom:1.5px solid var(--border2);background:var(--s2);
}
.stock-table td{
  padding:12px 16px;font-size:13px;
  border-bottom:1px solid var(--border);vertical-align:middle;
}
.stock-table tr:last-child td{border-bottom:none}
.stock-table tr:hover td{background:rgba(0,126,177,.03)}

.item-name{font-weight:600;color:var(--text)}
.item-ref{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.item-cat{
  display:inline-block;padding:3px 8px;border-radius:6px;
  font-family:var(--mono);font-size:10px;
}

/* Stock bar */
.stock-bar-wrap{display:flex;align-items:center;gap:10px;min-width:140px}
.stock-bar-bg{flex:1;height:5px;border-radius:99px;background:var(--s3)}
.stock-bar-fill{height:100%;border-radius:99px;transition:width .4s ease}
.bar-ok  {background:var(--green)}
.bar-warn{background:var(--orange)}
.bar-crit{background:var(--red)}
.stock-num{font-family:var(--mono);font-size:12px;color:var(--muted2);min-width:52px;text-align:right}

.action-btns{display:flex;gap:6px}
.act-btn{
  width:30px;height:30px;border-radius:8px;
  border:1.5px solid var(--border);background:var(--s2);
  color:var(--muted2);cursor:pointer;font-size:14px;font-weight:700;
  display:grid;place-items:center;transition:all .15s;
}
.act-btn:hover{border-color:var(--border2);color:var(--text);background:var(--s3)}
.act-btn.green:hover{background:rgba(22,163,74,.12);border-color:rgba(22,163,74,.3);color:var(--green)}
.act-btn.red:hover{background:rgba(220,38,38,.12);border-color:rgba(220,38,38,.3);color:var(--red)}
.act-btn.blue:hover{background:rgba(0,126,177,.12);border-color:rgba(0,126,177,.3);color:var(--blue1)}

/* ─── MOUVEMENTS ─── */
.mvt-list{display:grid;gap:0}
.mvt-row{
  padding:12px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;font-size:13px;
  transition:background .15s;
}
.mvt-row:hover{background:rgba(0,126,177,.03)}
.mvt-row:last-child{border-bottom:none}
.mvt-arrow{
  width:32px;height:32px;border-radius:8px;
  display:grid;place-items:center;font-size:14px;flex-shrink:0;
}
.mvt-arrow.in {background:rgba(22,163,74,.12);color:var(--green)}
.mvt-arrow.out{background:rgba(220,38,38,.12);color:var(--red)}
.mvt-main{flex:1;min-width:0}
.mvt-title{font-weight:600;color:var(--text)}
.mvt-sub{font-family:var(--sub);font-size:11px;color:var(--muted);margin-top:2px;font-weight:500}
.mvt-qty{font-family:var(--mono);font-size:14px;font-weight:600;flex-shrink:0}
.mvt-qty.in {color:var(--green)}
.mvt-qty.out{color:var(--red)}
.mvt-date{font-family:var(--mono);font-size:11px;color:var(--muted);flex-shrink:0}
.mvt-who{
  width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;font-size:10px;font-weight:700;flex-shrink:0;
}

/* ─── COMMANDES ─── */
.cmd-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:16px}
.cmd-card{
  background:var(--s2);border:1.5px solid var(--border);
  border-radius:var(--r-sm);padding:14px;
  transition:border-color .15s,box-shadow .15s;
}
.cmd-card:hover{border-color:var(--border2);box-shadow:var(--shadow-sm)}
.cmd-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.cmd-ref{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cmd-supplier{font-family:var(--title);font-size:14px;font-weight:700;margin-top:3px;color:var(--text)}
.cmd-items{font-family:var(--sub);font-size:12px;color:var(--muted2);margin-bottom:10px;line-height:1.6;font-weight:500}
.cmd-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:10px;border-top:1px solid var(--border);
}
.cmd-date{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cmd-amount{font-family:var(--title);font-size:15px;font-weight:700;color:var(--blue1)}

/* ─── AFFECTATIONS ─── */
.affect-list{display:grid;gap:0}
.affect-row{
  padding:13px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;font-size:13px;
}
.affect-row:last-child{border-bottom:none}
.affect-row:hover{background:rgba(0,126,177,.03)}
.affect-site{
  width:36px;height:36px;border-radius:9px;
  background:rgba(0,126,177,.10);border:1.5px solid rgba(0,126,177,.2);
  display:grid;place-items:center;font-size:14px;flex-shrink:0;
}
.affect-main{flex:1;min-width:0}
.affect-title{font-weight:600;color:var(--text)}
.affect-sub{font-family:var(--sub);font-size:11px;color:var(--muted);margin-top:2px;font-weight:500}
.affect-who{display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:12px;color:var(--muted2)}
.affect-date{font-family:var(--mono);font-size:11px;color:var(--muted);flex-shrink:0}

/* ─── ALERTES ─── */
.alert-banner{
  margin:12px 20px 0;padding:12px 16px;border-radius:var(--r-sm);
  display:flex;align-items:center;gap:12px;font-size:13px;
}
.alert-banner.crit{background:rgba(220,38,38,.07);border:1.5px solid rgba(220,38,38,.2)}
.alert-banner.warn{background:rgba(214,113,26,.07);border:1.5px solid rgba(214,113,26,.2)}
.alert-icon{font-size:18px;flex-shrink:0}
.alert-text strong{display:block;font-weight:700;margin-bottom:2px;color:var(--text)}
.alert-text span{font-family:var(--sub);color:var(--muted2);font-size:12px;font-weight:500}
.alert-action{
  margin-left:auto;padding:6px 14px;border-radius:999px;
  font-family:var(--sub);font-size:12px;font-weight:600;
  cursor:pointer;border:1.5px solid var(--border2);background:var(--s1);
  color:var(--blue1);transition:all .15s;white-space:nowrap;
}
.alert-action:hover{background:var(--blue1);color:#fff;border-color:var(--blue1)}

/* ─── MODAL ─── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(26,39,64,.45);
  backdrop-filter:blur(8px);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{
  background:var(--s1);border:1.5px solid var(--border2);
  border-radius:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;
  transform:translateY(18px);transition:transform .25s;
  box-shadow:0 12px 40px rgba(0,126,177,.14);
}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-hdr{
  padding:20px 22px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-hdr-title{font-family:var(--title);font-size:17px;font-weight:700;color:var(--text)}
.modal-close{
  width:28px;height:28px;border-radius:50%;background:var(--s2);
  border:1.5px solid var(--border);color:var(--muted);
  cursor:pointer;display:grid;place-items:center;transition:all .15s;font-size:14px;
}
.modal-close:hover{background:var(--s3);color:var(--text)}
.modal-body{padding:18px 22px 22px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row.full{grid-template-columns:1fr}
.form-row.trio{grid-template-columns:1fr 1fr 1fr}
.form-group label{
  display:block;font-family:var(--sub);font-size:10px;font-weight:700;
  color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;
}
.form-input,.form-select,.form-textarea{
  width:100%;background:var(--s2);border:1.5px solid var(--border);
  border-radius:9px;padding:9px 12px;color:var(--text);
  font-family:var(--font);font-size:13px;outline:none;
  transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{
  border-color:var(--blue2);box-shadow:0 0 0 3px rgba(18,170,204,.12);
}
.form-input::placeholder,.form-textarea::placeholder{color:var(--muted)}
.form-select option{background:var(--s1)}
.form-textarea{resize:vertical;min-height:64px}
.form-actions{display:flex;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.btn-cancel{
  flex:1;padding:10px;border-radius:999px;
  background:var(--s2);border:1.5px solid var(--border2);
  font-family:var(--sub);font-weight:600;
  color:var(--muted2);cursor:pointer;transition:all .15s;
}
.btn-cancel:hover{border-color:var(--gray);color:var(--text)}
.btn-save{
  flex:2;padding:10px;border-radius:999px;
  background:var(--yellow);border:none;
  font-family:var(--sub);font-weight:700;color:#1a2740;
  cursor:pointer;transition:all .15s;
  box-shadow:0 2px 8px rgba(250,196,32,.3);
}
.btn-save:hover{filter:brightness(1.08);box-shadow:0 4px 14px rgba(250,196,32,.4)}
.btn-save.blue{
  background:var(--blue1);color:#fff;
  box-shadow:0 2px 8px rgba(0,126,177,.25);
}
.btn-save.blue:hover{background:var(--blue2);box-shadow:0 4px 14px rgba(0,126,177,.35)}
.btn-save.red{background:var(--red);color:#fff}

/* Mouvement rapide */
.mvt-quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.mvt-quick-btn{
  padding:16px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--s2);cursor:pointer;text-align:center;transition:all .18s;
}
.mvt-quick-btn:hover{border-color:var(--border2);background:var(--s3)}
.mvt-quick-btn.selected-in{background:rgba(22,163,74,.10);border-color:rgba(22,163,74,.4)}
.mvt-quick-btn.selected-out{background:rgba(220,38,38,.10);border-color:rgba(220,38,38,.4)}
.mvt-quick-btn .qb-icon{font-size:22px;margin-bottom:6px}
.mvt-quick-btn .qb-label{font-family:var(--sub);font-size:13px;font-weight:700;color:var(--text)}
.mvt-quick-btn .qb-sub{font-family:var(--sub);font-size:11px;color:var(--muted);margin-top:2px;font-weight:500}

/* ─── TOAST ─── */
.toast{
  position:fixed;bottom:20px;right:24px;z-index:300;
  background:var(--s1);border:1.5px solid var(--border2);
  border-radius:999px;padding:10px 18px;font-family:var(--sub);font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:8px;
  opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none;
  box-shadow:var(--shadow-md);
}
.toast.show{opacity:1;transform:translateY(0)}
.toast-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.toast-dot.warn{background:var(--orange)}
.toast-dot.err{background:var(--red)}

/* ─── SCAN ─── */
.scan-banner{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:250;background:var(--blue1);color:#fff;
  border-radius:999px;padding:10px 22px;
  font-family:var(--sub);font-size:13px;font-weight:700;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 4px 20px rgba(0,126,177,.4);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.scan-banner.show{opacity:1}
.scan-banner .scan-dot{
  width:8px;height:8px;border-radius:50%;background:#fff;
  animation:scanpulse 1s ease-in-out infinite;
}
@keyframes scanpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.6)}}

.sn-input-wrap{
  display:flex;align-items:center;gap:8px;margin-bottom:6px;
}
.sn-input{
  flex:1;background:var(--s2);border:1.5px solid var(--border);
  border-radius:8px;padding:8px 12px;color:var(--text);
  font-family:var(--mono);font-size:13px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.sn-input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(18,170,204,.12)}
.sn-input::placeholder{color:var(--muted);font-family:var(--sub)}
.sn-scan-btn{
  width:36px;height:36px;border-radius:8px;flex-shrink:0;
  background:var(--blue1);border:none;color:#fff;
  font-size:16px;cursor:pointer;display:grid;place-items:center;
  transition:background .15s;
}
.sn-scan-btn:hover{background:var(--blue2)}
.sn-add-btn{
  background:transparent;border:1.5px dashed var(--border2);
  border-radius:8px;padding:7px 12px;width:100%;

}
.sn-add-btn:hover{border-color:var(--blue2);color:var(--blue1);background:rgba(0,126,177,.05)}
.sn-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,126,177,.08);border:1.5px solid rgba(0,126,177,.2);
  border-radius:6px;padding:3px 8px;

}
.sn-chip button{

}
.sn-chip button:hover{color:var(--red)}
.sn-chips-wrap{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px;min-height:0}

/* Camera modal */
.cam-overlay{
  position:fixed;inset:0;z-index:300;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.cam-overlay.open{opacity:1;pointer-events:all}
.cam-video{width:100%;max-width:480px;border-radius:12px;object-fit:cover}
.cam-frame{
  position:relative;width:100%;max-width:480px;
}
.cam-frame::after{
  content:'';position:absolute;
  top:50%;left:10%;right:10%;
  transform:translateY(-50%);
  height:2px;background:var(--blue2);
  box-shadow:0 0 12px var(--blue2);
  animation:camscan 2s ease-in-out infinite;
}
@keyframes camscan{0%,100%{top:30%}50%{top:70%}}
.cam-hint{color:#fff;font-family:var(--sub);font-size:13px;font-weight:500;margin-top:16px;opacity:.8}
.cam-close{
  position:absolute;top:20px;right:20px;
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.2);border:none;color:#fff;
  font-size:18px;cursor:pointer;display:grid;place-items:center;
}

/* ─── RESPONSIVE ─── */
@media(max-width:1100px){
  .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cmd-grid{grid-template-columns:1fr 1fr}
}

  .kpi-row{grid-template-columns:1fr 1fr;gap:10px}

  .form-row{grid-template-columns:1fr}

.main>*{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

<script>
// ══════════════════════════════════════════════════════
//  CONFIG — Google Apps Script (stockage partagé)
// ══════════════════════════════════════════════════════
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyKOgCdNuCLX4fv4mBMhM9su5uYV_SjeD3tXrPu0GSmsVakQMmrqN7B6WK_LMJ6W29v/exec';
const ADMINS = ['Virginie', 'Stéphane'];
function isAdmin(){ 
  const normalize = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  return ADMINS.some(a => normalize(a) === normalize(currentUser));
}
let currentUser = loadLS('sw_current_user') || '';

// ══════════════════════════════════════════════════════
//  COUCHE API — appels vers Apps Script
// ══════════════════════════════════════════════════════
async function gasCall(params) {
  // Apps Script CORS : on encode tout en query string GET (no preflight)
  const qs = Object.entries(params)
    .map(([k,v]) => encodeURIComponent(k) + '=' + encodeURIComponent(typeof v === 'object' ? JSON.stringify(v) : v))
    .join('&');
  const res = await fetch(GAS_URL + '?' + qs);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Erreur Apps Script');
  return json.data;
}

// ══════════════════════════════════════════════════════
//  DATA
// ══════════════════════════════════════════════════════
let articles   = [];
let mouvements = [];
let commandes  = [];

let currentTab  = 'stock';
let stockFilter = 'all';
let stockSearch = '';
let _isSyncing  = false;

// ── Indicateur de sync dans la topbar ──
function setSyncStatus(status, msg) {
  const el = document.getElementById('syncIndicator');
  if (!el) return;
  const cfg = {
    idle:    { icon: '✓', color: 'var(--green)',  label: 'Synchronisé' },
    loading: { icon: '⟳', color: 'var(--blue2)', label: 'Chargement…' },
    saving:  { icon: '⬆', color: 'var(--orange)', label: 'Enregistrement…' },
    error:   { icon: '⚠', color: 'var(--red)',   label: 'Erreur sync' },
    offline: { icon: '📵', color: 'var(--gray)',  label: 'Mode hors ligne' },
  };
  const c = cfg[status] || cfg.idle;
  el.textContent = c.icon + ' ' + (msg || c.label);
  el.style.color = c.color;
  el.style.animation = (status === 'loading' || status === 'saving') ? 'spin .8s linear infinite' : '';
}

// ── Gestion utilisateur ──
// isAdmin définie avec normalize dans ADMINS

function confirmLogin(){
  const sel = document.getElementById('loginSelect').value;
  if(!sel){ toast('Veuillez choisir un nom','warn'); return; }
  currentUser = sel;
  saveLS('sw_current_user', currentUser);
  document.getElementById('modalLogin').classList.remove('open');
  // Pré-remplir le champ Qui dans les modales
  if(document.getElementById('mvtWho')) document.getElementById('mvtWho').value = currentUser;
  updateUserBadge();
  toast(`Bonjour ${currentUser} 👋`);
}

function updateUserBadge(){
  const el = document.getElementById('userBadge');
  if(el) el.textContent = currentUser || '?';
}

function changeUser(){
  document.getElementById('loginSelect').value = '';
  document.getElementById('modalLogin').classList.add('open');
}

// ── Chargement initial depuis Google Sheets ──
async function loadFromSheets() {
  setSyncStatus('loading');
  try {
    // Stock + catalogue
    const stockData = await gasCall({ action: 'getStock' });
    articles = (stockData.catalogue || []).map(p => {
      // ID stable : EAN en priorité, sinon slug du nom (évite uid() aléatoire à chaque reload)
      const stableId = (p.ean || '').trim() || 'art_' + (p.nom || '').toLowerCase().replace(/[^a-z0-9]/g,'_').slice(0,30);
      return {
        id:       stableId,
        name:     p.nom || '',
        ref:      p.reference_fournisseur || '',
        ean:      (p.ean || '').trim(),
        cat:      detectCat(p.nom || ''),
        supplier: p.fournisseur || '',
        qty:      Number(p.stock_actuel) || 0,
        min:      Number(p.seuil_alerte) || 2,
        max:      Math.max(Number(p.seuil_alerte) * 3, 10),
        location: '',
        notes:    p.notes || '',
      };
    });
    // Mouvements
    const mvtData = await gasCall({ action: 'getMouvements', limit: 300 });
    mouvements = (mvtData || []).map(m => {
      // Retrouver l'article correspondant pour avoir son id local stable
      const ean = (m.ean || '').trim();
      const matchingArt = articles.find(a => a.ean === ean || a.id === ean);
      return {
        id:          m.id,
        articleId:   matchingArt ? matchingArt.id : ean,
        articleName: m.produit || (matchingArt ? matchingArt.name : ''),
        qty:         Number(m.quantite) || 0,
        type:        (m.type === 'entree' || m.type === 'retour') ? 'in' : 'out',
        who:         m.utilisateur || '',
        date:        (m.date || '').slice(0, 10),
        chantier:    m.chantier || '',
        note:        m.notes || '',
        serials:     [],
      };
    });
    // Commandes en local (pas dans le GAS pour l'instant)
    const DEMO_CMD = /^c[1-3]$/;
    commandes = (loadLS('sw_commandes') || []).filter(x => !DEMO_CMD.test(x.id || ''));
    // Cache de secours
    saveLS('sw_articles_cache',   articles);
    saveLS('sw_mouvements_cache', mouvements);
    setSyncStatus('idle');
    render();
  } catch (e) {
    console.warn('Sheets inaccessible, fallback cache local :', e.message);
    setSyncStatus('offline');
    const DEMO_ID_RE = /^(a[1-8]|m[1-7]|c[1-3])$/;
    const purge = list => Array.isArray(list) ? list.filter(x => !(x && typeof x.id === 'string' && DEMO_ID_RE.test(x.id))) : [];
    articles   = purge(loadLS('sw_articles_cache')   || loadLS('sw_articles')   || []);
    mouvements = purge(loadLS('sw_mouvements_cache') || loadLS('sw_mouvements') || []);
    commandes  = purge(loadLS('sw_commandes') || []);
    render();
  }
}

// Détection automatique de catégorie selon le nom produit
function detectCat(nom) {
  const n = nom.toLowerCase();
  if (/borne|eap|ap |wifi|access/.test(n)) return 'borne';
  if (/switch|sg-|tl-sg|sg108/.test(n))    return 'switch';
  if (/routeur|router|tl-er|er605/.test(n)) return 'routeur';
  if (/câble|cable|cat6|ftp|sfp/.test(n))   return 'cable';
  if (/poe|inject|alim|power/.test(n))      return 'alimentation';
  if (/fixat|mast|support|bride/.test(n))   return 'fixation';
  return 'autre';
}

const catConfig = {
  borne:        {label:'Borne Wifi',  bg:'rgba(0,126,177,.12)',  color:' #007eb1'},
  switch:       {label:'Switch',      bg:'rgba(124,58,237,.12)', color:'#6d28d9'},
  routeur:      {label:'Routeur',     bg:'rgba(8,145,178,.12)',  color:'#0e7490'},
  cable:        {label:'Câblage',     bg:'rgba(100,116,139,.12)',color:'#475569'},
  alimentation: {label:'Alim / PoE', bg:'rgba(214,113,26,.12)', color:'#b45309'},
  fixation:     {label:'Fixation',    bg:'rgba(22,163,74,.12)',  color:'#15803d'},
  autre:        {label:'Autre',       bg:'rgba(100,116,139,.12)',color:'#475569'},
};

const cmdStatusConfig = {
  en_attente: {label:'En attente', cls:'tag-gray'},
  commandé:   {label:'Commandé',  cls:'tag-info'},
  expédié:    {label:'Expédié',   cls:'tag-warn'},
  reçu:       {label:'Reçu ✓',   cls:'tag-ok'},
  annulé:     {label:'Annulé',   cls:'tag-crit'},
};

const ownerColors = {
  Anthony:'#007eb1', Fabian:'#0891b2', Jonovan:'#7c3aed', Frédéric:'#d6711a',
  Ambre:'#6d28d9',   Amanda:'#0e7490', Virginie:'#16a34a', Stéphane:'#dc2626',
};

// ══════════════════════════════════════════════════════
//  STORAGE — localStorage (cache local) + Google Sheets (source de vérité)
// ══════════════════════════════════════════════════════
function loadLS(k){try{const d=localStorage.getItem(k);return d?JSON.parse(d):null}catch(e){return null}}
function saveLS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

// saveAll = mise à jour du cache local uniquement
// Les écritures réelles vers Sheets se font dans saveArticle() et saveMouvement()
function saveAll(){
  saveLS('sw_articles_cache', articles);
  saveLS('sw_mouvements_cache', mouvements);
  saveLS('sw_commandes', commandes);
}

function uid(){return 's_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(s){if(!s)return'—';const d=new Date(s+'T12:00:00');const m=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear()}

function renderAffectations(){
  const chantiers = {};
  mouvements.filter(m=>m.type==='out'&&m.chantier).forEach(m=>{

    if(!chantiers[k]) chantiers[k]={name:k,items:[],who:new Set(),lastDate:m.date};
    const art = articles.find(a=>a.id===m.articleId);
    chantiers[k].items.push({name:art?art.name:m.articleName||'?',qty:m.qty,who:m.who,date:m.date,note:m.note});
    if(m.who) chantiers[k].who.add(m.who);
    if(m.date>chantiers[k].lastDate) chantiers[k].lastDate=m.date;

  const list = Object.values(chantiers).sort((a,b)=>new Date(b.lastDate)-new Date(a.lastDate));

  let html=`<div class="panel">

async function saveArticle(){
  const name = document.getElementById('aName').value.trim();
  if(!name){alert('Le nom est obligatoire.');return;}
  const editId = document.getElementById('aEditId').value;
  const eanField = document.getElementById('aEan').value.trim();

  // En mode édition : on conserve l'id existant pour ne pas créer de doublon
  // L'EAN peut être mis à jour mais l'id local reste celui de l'article original
  const localId = editId || eanField || uid();
  const ean     = eanField || localId;

  const obj = {
    id:       localId,
    name,
    ref:      document.getElementById('aRef').value.trim(),
    ean,
    cat:      document.getElementById('aCat').value,
    supplier: document.getElementById('aSupplier').value.trim(),
    qty:      parseInt(document.getElementById('aQty').value)||0,
    min:      parseInt(document.getElementById('aMin').value)||2,
    max:      parseInt(document.getElementById('aMax').value)||10,
    location: document.getElementById('aLocation').value.trim(),
    notes:    document.getElementById('aNotes').value.trim(),
  };

  // Mise à jour locale immédiate — trouve par id (pas par ean)
  const existing = articles.findIndex(a => a.id === localId);
  if(existing >= 0) articles[existing] = obj;
  else articles.push(obj);

  saveAll(); closeModal('modalArticle'); render(); toast('Enregistrement…','ok');

  // Écriture vers Google Sheets — on upsert par EAN (clé Sheets)
  setSyncStatus('saving');
  try {
    await gasCall({
      action:                'upsertProduit',
      ean:                   ean,
      nom:                   name,
      seuil_alerte:          obj.min,
      stock_actuel:          obj.qty,
      fournisseur:           obj.supplier,
      reference_fournisseur: obj.ref,
      notes:                 obj.notes,
    });
    setSyncStatus('idle');
    toast('Article enregistré ✓');
  } catch(e) {
    setSyncStatus('error', 'Sync échouée');
    toast('Article sauvé localement (sync échouée)', 'warn');
  }
}

function editArticle(id){
  const a = articles.find(x=>x.id===id);
  if(!a)return;
  // Remplir les champs AVANT d'ouvrir la modale (openModal efface tout)
  document.getElementById('aEditId').value              = a.id;
  document.getElementById('modalArticleTitle').textContent = 'Modifier l\'article';
  document.getElementById('aName').value                = a.name||'';
  document.getElementById('aRef').value                 = a.ref||'';
  document.getElementById('aEan').value                 = a.ean||'';
  document.getElementById('aCat').value                 = a.cat||'autre';
  document.getElementById('aSupplier').value            = a.supplier||'';
  document.getElementById('aQty').value                 = a.qty||0;
  document.getElementById('aMin').value                 = a.min||2;
  document.getElementById('aMax').value                 = a.max||10;
  document.getElementById('aLocation').value            = a.location||'';
  document.getElementById('aNotes').value               = a.notes||'';
  // Ouvrir directement sans passer par openModal() qui réinitialise aEditId
  document.getElementById('modalArticle').classList.add('open');
}

function removeEditSn(idx){
  const list = JSON.parse(document.getElementById('editMvtSnList').value || '[]');
  list.splice(idx, 1);
  document.getElementById('editMvtSnList').value = JSON.stringify(list);
  renderEditSnChips(list);

function editSnInputKey(e){
  if(e.key === 'Enter' || e.key === 'Tab'){
    e.preventDefault();
    const inp = document.getElementById('editMvtSnInput');
    const val = normalizeSN(inp.value.trim());
    if(!val) return;
    const list = JSON.parse(document.getElementById('editMvtSnList').value || '[]');
    if(!list.includes(val)){ list.push(val); }
    document.getElementById('editMvtSnList').value = JSON.stringify(list);
    renderEditSnChips(list);
    inp.value = '';
  }
}

async function saveEditMouvement(){
  const id  = document.getElementById('editMvtId').value;
  const idx = mouvements.findIndex(x => x.id === id);
  if(idx < 0) return;

  const oldMvt = mouvements[idx];
  const artId  = document.getElementById('editMvtArticle').value;
  const art    = articles.find(a => a.id === artId);
  const newQty = parseInt(document.getElementById('editMvtQty').value) || 1;
  const newType = document.getElementById('editMvtType').value;

  // Recalcul stock : annuler l'ancien mouvement, appliquer le nouveau
  const oldArt = articles.find(a => a.id === oldMvt.articleId);
  if(oldArt){
    oldArt.qty = oldMvt.type === 'in'
      ? Math.max(0, oldArt.qty - oldMvt.qty)
      : oldArt.qty + oldMvt.qty;
  }
  if(art){
    art.qty = newType === 'in' ? art.qty + newQty : Math.max(0, art.qty - newQty);
  }

  const updatedMvt = {
    ...oldMvt,
    articleId:   artId,
    articleName: art ? art.name : oldMvt.articleName,
    qty:         newQty,
    type:        newType,
    who:         document.getElementById('editMvtWho').value,
    date:        document.getElementById('editMvtDate').value,
    chantier:    document.getElementById('editMvtChantier').value.trim(),
    note:        document.getElementById('editMvtNote').value.trim(),
    serials:     JSON.parse(document.getElementById('editMvtSnList').value || '[]'),
  };
  mouvements[idx] = updatedMvt;
  saveAll(); closeModal('modalEditMvt'); render(); toast('Mouvement modifié ✓');

  // Sync Sheets : supprimer l'ancien, recréer le nouveau
  setSyncStatus('saving');
  try {
    await gasCall({ action: 'deleteMouvement', id });
    await gasCall({
      action:      'addMouvement',
      type:        newType === 'in' ? 'entree' : 'sortie',
      produit:     updatedMvt.articleName,
      ean:         art ? (art.ean || art.id) : artId,
      quantite:    newQty,
      utilisateur: updatedMvt.who,
      notes:       updatedMvt.note,
      chantier:    updatedMvt.chantier,
    });
    setSyncStatus('idle');
  } catch(e){
    setSyncStatus('error', 'Sync échouée');
    toast('Modifié localement (sync échouée)', 'warn');
  }
}

async function deleteMouvement(id){
  const m = mouvements.find(x => x.id === id);
  if(!m) return;
  const art = articles.find(a => a.id === m.articleId);
  if(!confirm(`Supprimer ce mouvement (${m.type==='in'?'+':'−'}${m.qty} · ${m.articleName||'?'}) ?`)) return;
  // Annuler l'effet sur le stock
  if(art){ art.qty = m.type==='in' ? Math.max(0, art.qty - m.qty) : art.qty + m.qty; }
  mouvements = mouvements.filter(x => x.id !== id);
  saveAll(); render(); toast('Mouvement supprimé','warn');
  setSyncStatus('saving');
  try {
    await gasCall({ action: 'deleteMouvement', id });

async function deleteArticle(id){
  const a = articles.find(x => x.id === id);
  if(!a) return;
  if(!confirm(`Supprimer "${a.name}" du catalogue ?\nCette action est irréversible.`)) return;
  // Suppression locale immédiate
  articles = articles.filter(x => x.id !== id);
  saveAll(); render(); toast(`"${a.name}" supprimé`, 'warn');
  // Suppression dans Google Sheets
  setSyncStatus('saving');
  try {
    await gasCall({ action: 'deleteProduit', ean: a.ean || a.id });
    setSyncStatus('idle');
  } catch(e) {
    setSyncStatus('error', 'Sync échouée');
    toast('Supprimé localement (sync échouée)', 'warn');
  }
}

function saveMouvement(){
  const articleId = document.getElementById('mvtArticle').value;
  const qty  = parseInt(document.getElementById('mvtQty').value)||1;
  const type = document.getElementById('mvtType').value;
  if(!articleId){alert('Sélectionner un article.');return;}
  const art = articles.find(a=>a.id===articleId);
  if(type==='out'&&art&&art.qty<qty){
    if(!confirm(`Stock insuffisant (${art.qty} disponible). Continuer quand même ?`))return;
  }
  // Récupérer les numéros de série
  const snRaw = document.getElementById('mvtSnList').value;
  const serials = snRaw ? snRaw.split('||').filter(Boolean) : [];

  const mvt = {
    id:          uid(),
    articleId,
    articleName: art?art.name:'',
    qty, type,
    who:      document.getElementById('mvtWho').value,
    date:     document.getElementById('mvtDate').value||today(),
    chantier: document.getElementById('mvtChantier').value.trim(),
    note:     document.getElementById('mvtNote').value.trim(),
    serials,  // ← numéros de série
  };
  // Mise à jour locale immédiate
  mouvements.push(mvt);
  if(art) art.qty = type==='in'?art.qty+qty:Math.max(0,art.qty-qty);
  saveAll(); closeModal('modalMvt'); render();
  const snInfo = serials.length ? ` · ${serials.length} SN enregistré${serials.length>1?'s':''}` : '';
  const toastMsg = type==='in'?`+${qty} en stock ✓${snInfo}`:`−${qty} sorti · ${mvt.chantier||'stock'}${snInfo}`;
  toast(toastMsg, type==='in'?'ok':'warn');
  // Écriture asynchrone vers Google Sheets
  setSyncStatus('saving');
  gasCall({
    action:      'addMouvement',
    type:        type==='in' ? 'entree' : 'sortie',
    produit:     mvt.articleName,
    ean:         art ? (art.ean || art.id) : articleId,
    quantite:    qty,
    utilisateur: mvt.who,
    notes:       mvt.note,
    chantier:    mvt.chantier,
  }).then(() => {
    setSyncStatus('idle');
  }).catch(e => {
    setSyncStatus('error', 'Sync échouée');
    toast('Mouvement sauvé localement (sync échouée)', 'warn');
  });
}

function getSnList(){
  const v = document.getElementById('mvtSnList').value;
  return v ? v.split('||').filter(Boolean) : [];
}

function setSnList(arr){
  document.getElementById('mvtSnList').value = arr.join('||');
  renderSnChips(arr);
  // Mettre à jour la quantité automatiquement
  const qtyEl = document.getElementById('mvtQty');
  if(arr.length > 0) qtyEl.value = arr.length;
}

function renderSnChips(arr){
  const wrap = document.getElementById('mvtSnChips');
  if(!wrap) return;
  wrap.innerHTML = arr.map((sn,i) =>
    `<span class="sn-chip">${esc(sn)}<button onclick="removeSn(${i})" title="Supprimer">×</button></span>`
  ).join('');
}

function removeSn(idx){
  const list = getSnList();
  list.splice(idx,1);
  setSnList(list);
}

function addSnFromInput(){
  const inp = document.getElementById('mvtSnInput');
  const raw = inp.value.trim();
  if(!raw) return;
  const val = normalizeSN(raw);
  const list = getSnList();
  if(list.includes(val)){ toast('SN déjà ajouté','warn'); inp.value=''; return; }
  list.push(val);
  setSnList(list);
  inp.value='';
  inp.focus();
  toast(`SN ${val} ajouté ✓`);
}

function snInputKey(e){
  // Enter ou Tab → ajouter le SN
  if(e.key==='Enter'||e.key==='Tab'){
    e.preventDefault();
    addSnFromInput();
  }
}

// ══════════════════════════════════════════════════════
//  DOUCHETTE BLUETOOTH — DÉTECTION SAISIE RAPIDE
// ══════════════════════════════════════════════════════
// La douchette envoie les caractères très vite (< 50ms entre chaque)
// puis un Enter final. On détecte ça vs saisie humaine normale.

let scanBuffer = '';
let scanTimer  = null;
let lastKeyTime = 0;
const SCAN_SPEED_THRESHOLD = 50; // ms — plus rapide = douchette
const SCAN_MIN_LEN = 6;          // longueur min pour considérer comme scan valide

document.addEventListener('keydown', (e) => {
  // Ignorer si on est dans un champ de saisie (sauf le champ SN dédié)
  const active = document.activeElement;
  const isSNField = active && active.id === 'mvtSnInput';
  const isOtherInput = active && ['INPUT','SELECT','TEXTAREA'].includes(active.tagName) && !isSNField;

  if(isOtherInput) return;

  const now = Date.now();
  const delta = now - lastKeyTime;
  lastKeyTime = now;

  if(e.key === 'Enter') {
    if(scanBuffer.length >= SCAN_MIN_LEN) {
      handleScan(scanBuffer);
    }
    scanBuffer = '';
    clearTimeout(scanTimer);
    return;
  }

  // Caractère imprimable
  if(e.key.length === 1) {
    // Si trop lent → c'est une saisie humaine, on vide le buffer
    if(delta > 200 && scanBuffer.length > 0) {
      scanBuffer = '';
    }
    scanBuffer += e.key;

    // Timer de sécurité : si pas de Enter dans 500ms, vider
    clearTimeout(scanTimer);
    scanTimer = setTimeout(() => { scanBuffer = ''; }, 500);
  }
});

// Nettoie un code scanné pour n'extraire que le SN utile
// Ex: "Serial Number 1:2261688000255" → "2261688000255"
// Ex: "Part Number:1700000363" → "1700000363"
// Ex: "Box S/N:2261688X00126 EU/1.0" → "2261688X00126"
function normalizeSN(raw) {
  raw = raw.trim();
  // Cas 1 : préfixe texte suivi de ":" → extraire ce qui suit
  const colonMatch = raw.match(/[A-Za-z\s\/\.]+[:\s]+([A-Z0-9\-\.\/]+)/i);
  if (colonMatch) {
    // Prendre la première séquence alphanumérique longue (≥ 6 caractères)
    const candidate = colonMatch[1].trim().split(/\s+/)[0];
    if (candidate.length >= 6) return candidate;
  }
  // Cas 2 : code déjà propre (EAN, SN numérique pur)
  return raw;
}

function handleScan(code){
  code = code.trim();
  if(!code) return;

  // Afficher la bannière
  showScanBanner(code);

  // Si la modale mouvement est ouverte → ajouter comme SN
  const mvtModal = document.getElementById('modalMvt');
  if(mvtModal && mvtModal.classList.contains('open')){
    const sn = normalizeSN(code);
    const list = getSnList();
    if(!list.includes(sn)){
      list.push(sn);
      setSnList(list);
      toast(`SN scanné : ${sn}`);
    } else {
      toast('SN déjà enregistré','warn');
    }
    return;
  }

  // Sinon → chercher l'article par EAN, id ou référence
  const art = articles.find(a =>
    a.ean === code || a.id === code || a.ref === code ||
    a.name.toLowerCase().includes(code.toLowerCase())
  );

  if(art){
    // Ouvrir directement la modale mouvement avec cet article
    quickMvt(art.id, 'out');
    toast(`📦 ${art.name} — choisissez le type de mouvement`);
  } else {
    // Article inconnu → création à la volée, formulaire pré-rempli
    toast(`Code inconnu : ${code} — nouvel article pré-rempli, complétez et enregistrez`, 'warn');
    openModal('article');
    setTimeout(()=>{
      const isEan = /^\d{8}$|^\d{12,14}$/.test(code);
      document.getElementById(isEan ? 'aEan' : 'aRef').value = code;
      const nameField = document.getElementById('aName');
      if(nameField) nameField.focus();
    }, 100);
  }
}

let scanBannerTimer;
function showScanBanner(code){
  const el = document.getElementById('scanBanner');
  document.getElementById('scanBannerMsg').textContent = `Scan : ${code}`;
  el.classList.add('show');
  clearTimeout(scanBannerTimer);
  scanBannerTimer = setTimeout(()=>el.classList.remove('show'), 2000);
}

// ══════════════════════════════════════════════════════
//  FORMATS DE SCAN — EAN + codes industriels + QR
//  (intersection avec les formats supportés par l'appareil)
// ══════════════════════════════════════════════════════
let SCAN_FORMATS = ['ean_13','ean_8','code_128','qr_code'];
(async () => {
  try{
    if('BarcodeDetector' in window && BarcodeDetector.getSupportedFormats){
      const sup    = await BarcodeDetector.getSupportedFormats();
      const wished = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','itf','codabar','qr_code','data_matrix','pdf417','aztec'];
      const f = wished.filter(x => sup.includes(x));
      if(f.length) SCAN_FORMATS = f;
    }
  }catch(e){}
})();

// ══════════════════════════════════════════════════════
//  CAMÉRA PWA (iOS Safari + Android Chrome)
// ══════════════════════════════════════════════════════
let camStream = null;
let camTargetInput = null;
let camScanInterval = null;

async function openCamera(targetInputId){
  camTargetInput = targetInputId;
  const overlay = document.getElementById('camOverlay');
  const video   = document.getElementById('camVideo');

  overlay.classList.add('open');

  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width:{ideal:1280}, height:{ideal:720} }
    });
    video.srcObject = camStream;

    // Utiliser BarcodeDetector si disponible (Android Chrome)
    if('BarcodeDetector' in window){
      const detector = new BarcodeDetector({formats:SCAN_FORMATS});
      camScanInterval = setInterval(async ()=>{
        try{
          const codes = await detector.detect(video);
          if(codes.length > 0){
            const code = codes[0].rawValue;
            closeCamera();
            handleCameraResult(code);
          }
        }catch(e){}
      }, 300);
    } else {
      // Fallback iOS / navigateurs sans BarcodeDetector
      // Afficher bouton capture manuelle
      showManualCapture();
    }
  } catch(err){
    closeCamera();
    toast('Caméra inaccessible — vérifiez les permissions', 'err');
  }
}

function showManualCapture(){
  const hint = document.querySelector('.cam-hint');
  if(!hint) return;
  hint.innerHTML = `Scan automatique non disponible sur cet appareil.<br>
    <button onclick="manualCapture()" style="margin-top:12px;background:var(--blue1);color:#fff;border:none;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer">
      📷 Capturer
    </button>`;
}

async function manualCapture(){
  // Sur iOS on utilise un input file avec capture
  const input = document.createElement('input');
  input.type='file'; input.accept='image/*'; input.capture='environment';
  input.onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if('BarcodeDetector' in window){
      const img = await createImageBitmap(file);
      const detector = new BarcodeDetector({formats:SCAN_FORMATS});
      try{
        const codes = await detector.detect(img);
        if(codes.length>0){ closeCamera(); handleCameraResult(codes[0].rawValue); }
        else toast('Aucun code détecté — réessayez','warn');
      }catch(e){ toast('Erreur lecture code','err'); }
    } else {
      // Fallback : saisie manuelle du SN après photo
      closeCamera();
      toast('Saisissez le SN manuellement','warn');
    }
  };
  input.click();
}

function handleCameraResult(code){
  code = code.trim();
  if(!code) return;
  showScanBanner(code);

  // Si modale mouvement ouverte → ajouter SN
  const mvtModal = document.getElementById('modalMvt');
  if(mvtModal && mvtModal.classList.contains('open')){
    const list = getSnList();
    if(!list.includes(code)){ list.push(code); setSnList(list); toast(`SN scanné : ${code}`); }
    else toast('SN déjà enregistré','warn');
    return;
  }
  // Sinon → recherche article
  handleScan(code);
}

function closeCamera(){
  const overlay = document.getElementById('camOverlay');
  overlay.classList.remove('open');
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  clearInterval(camScanInterval); camScanInterval=null;
  // Restaurer le hint
  const hint = document.querySelector('.cam-hint');
  if(hint) hint.textContent = 'Pointez la caméra vers le code-barres';
}

function openCameraForEan(){
  // Ouvrir la caméra et mettre le résultat dans le champ EAN
  camTargetInput = 'aEan';
  const overlay = document.getElementById('camOverlay');
  const video   = document.getElementById('camVideo');
  overlay.classList.add('open');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
    .then(stream=>{
      camStream = stream;
      video.srcObject = stream;
      if('BarcodeDetector' in window){
        const detector = new BarcodeDetector({formats:SCAN_FORMATS});
        camScanInterval = setInterval(async()=>{
          try{
            const codes = await detector.detect(video);
            if(codes.length>0){
              const code = codes[0].rawValue;
              closeCamera();
              document.getElementById('aEan').value = code;
              toast(`EAN scanné : ${code}`);
            }
          }catch(e){}
        },300);
      } else { showManualCapture(); }
    })
    .catch(()=>{ closeCamera(); toast('Caméra inaccessible','err'); });
}
